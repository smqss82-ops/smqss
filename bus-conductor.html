<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bus Conductor — SMQSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
.header{background:#fff;border-bottom:3px solid #d4aa00;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand svg{width:28px;height:28px;fill:#155c30}
.header-title{font-size:16px;font-weight:700;color:#155c30}.header-title span{color:#d4aa00}
.header-right{display:flex;align-items:center;gap:10px}
.header-status{font-size:11px;padding:4px 10px;border-radius:20px;background:#e8f4ed;color:#155c30;font-weight:600}
.reset-btn{display:none;padding:6px 12px;background:#c0392b;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-bottom:80px}
.card{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
select{width:100%;padding:12px;border:1.5px solid #e2e0da;border-radius:8px;font-size:16px;color:#1a1a1a;background:#f7f6f2;outline:none;font-family:inherit;font-weight:600}
select:focus{border-color:#155c30;background:#fff}
input[type=text]{width:100%;padding:12px;border:1.5px solid #e2e0da;border-radius:8px;font-size:16px;color:#1a1a1a;background:#f7f6f2;outline:none;font-family:inherit}
input[type=text]:focus{border-color:#155c30;background:#fff}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:#155c30;color:#fff}.btn-primary:hover{background:#1e7d43}
.btn-gold{background:#d4aa00;color:#fff}.btn-gold:hover{background:#b8890a}
.form-group{margin-bottom:12px}
.add-row{display:flex;gap:8px;align-items:flex-end}
.add-row .form-group{flex:1;margin-bottom:0}
.add-row .add-stop-btn{padding:12px 16px;background:#155c30;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.add-stop-btn:hover{background:#1e7d43}
.toggle-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.toggle-label{font-size:14px;font-weight:600;color:#374151;flex:1}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#d1d5db;border-radius:24px;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:#155c30}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px)}

.trip-banner{background:linear-gradient(135deg,#155c30,#1e7d43);color:#fff;border-radius:12px;padding:18px;text-align:center;display:none}
.trip-company{font-size:20px;font-weight:700}
.trip-route{font-size:14px;opacity:.8;margin-top:2px}

.stop-list{display:flex;flex-direction:column;gap:8px}
.trip-stop{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:12px;border:2px solid #e2e0da;cursor:pointer;transition:all .2s}
.trip-stop:active{transform:scale(0.98)}
.trip-stop.done{border-color:#155c30;background:#e8f4ed}
.trip-stop.is-break{border-color:#d4aa00;background:#fdf3d8}
.trip-stop.done.is-break{border-color:#155c30;background:#e8f4ed}
.trip-num{font-size:22px;font-weight:900;color:#fff;background:#9ca3af;width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.trip-stop.done .trip-num{background:#155c30}
.trip-stop.is-break .trip-num{background:#d4aa00}
.trip-stop.done.is-break .trip-num{background:#155c30}
.trip-info{flex:1}
.trip-name{font-size:20px;font-weight:700;color:#1a1a1a}
.trip-stop.done .trip-name{color:#155c30}
.trip-status{font-size:12px;color:#6b7280;margin-top:2px}
.trip-stop.done .trip-status{color:#155c30;font-weight:600}
.trip-action{padding:12px 20px;background:#155c30;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;min-width:100px}
.trip-stop.done .trip-action{background:#e8f4ed;color:#155c30}

.empty-msg{text-align:center;padding:40px 20px;color:#9ca3af;font-size:15px}
.empty-msg strong{display:block;font-size:18px;color:#6b7280;margin-bottom:4px}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#155c30;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#c0392b}
</style>
</head>
<body>
<header class="header">
  <div class="header-brand">
    <svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
    <div class="header-title">SMQSS <span>Bus</span></div>
  </div>
  <div class="header-right">
    <button class="reset-btn" id="resetBtn" onclick="resetTrip()">Reset Trip</button>
    <div class="header-status" id="connStatus">Connected</div>
  </div>
</header>

<main class="main">
  <!-- SELECT ROUTE -->
  <div id="selectSection">
    <div class="card">
      <div class="card-title">Select Your Route</div>
      <div class="form-group">
        <label>Bus Company</label>
        <select id="companySelect" onchange="loadRoutes()"><option value="">-- Choose company --</option></select>
      </div>
      <div class="form-group">
        <label>Route</label>
        <select id="routeSelect" onchange="loadStops()"><option value="">-- Choose route --</option></select>
      </div>
      <div id="stopsPreview" style="margin-top:8px"></div>
      <button class="btn btn-primary" id="startBtn" onclick="startTrip()" style="margin-top:12px;display:none">Start Trip</button>
    </div>

    <!-- ADD STOP (one-time config) -->
    <div class="card" id="addStopCard" style="display:none">
      <div class="card-title">Add a Stop Point</div>
      <div class="add-row">
        <div class="form-group"><label>Stop Name</label><input type="text" id="newStopName" placeholder="e.g. Kamdini"></div>
        <button class="add-stop-btn" onclick="addStop()">+ Add</button>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Rest Break Point</span>
        <label class="toggle"><input type="checkbox" id="newStopBreak"><span class="toggle-slider"></span></label>
      </div>
    </div>
  </div>

  <!-- ANNOUNCE STOPS -->
  <div id="announceSection" style="display:none">
    <div class="trip-banner" id="tripBanner">
      <div class="trip-company" id="tripCompany"></div>
      <div class="trip-route" id="tripRoute"></div>
    </div>
    <div class="stop-list" id="tripStopList"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let companies = [], routes = [], stops = [];
let selectedCompanyId = null, selectedRouteId = null;
let announcedIds = new Set();

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

async function loadCompanies() {
  try {
    const r = await fetch(API + '/api/bus/companies');
    const d = await r.json();
    if (d.success) {
      companies = d.companies;
      document.getElementById('companySelect').innerHTML = '<option value="">-- Choose company --</option>' + companies.map(c => '<option value="'+c.id+'">'+c.company_name+'</option>').join('');
    }
  } catch(e) {}
}

async function loadRoutes() {
  const cid = document.getElementById('companySelect').value;
  selectedCompanyId = cid || null;
  selectedRouteId = null;
  stops = [];
  document.getElementById('routeSelect').innerHTML = '<option value="">-- Choose route --</option>';
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('addStopCard').style.display = 'none';
  document.getElementById('stopsPreview').innerHTML = '';
  if (!cid) return;
  try {
    const r = await fetch(API + '/api/bus/routes/' + cid);
    const d = await r.json();
    if (d.success) {
      routes = d.routes;
      document.getElementById('routeSelect').innerHTML = '<option value="">-- Choose route --</option>' + routes.map(r => '<option value="'+r.id+'">'+r.route_name+'</option>').join('');
    }
  } catch(e) {}
}

async function loadStops() {
  const rid = document.getElementById('routeSelect').value;
  selectedRouteId = rid || null;
  if (!rid) { stops = []; document.getElementById('startBtn').style.display = 'none'; document.getElementById('addStopCard').style.display = 'none'; document.getElementById('stopsPreview').innerHTML = ''; return; }
  try {
    const r = await fetch(API + '/api/bus/stops/' + rid);
    const d = await r.json();
    if (d.success) {
      stops = d.stops;
      renderPreview();
      document.getElementById('addStopCard').style.display = 'block';
      if (stops.length) document.getElementById('startBtn').style.display = 'block';
    }
  } catch(e) {}
}

function renderPreview() {
  const el = document.getElementById('stopsPreview');
  if (!stops.length) { el.innerHTML = '<div style="padding:8px 0;font-size:13px;color:#9ca3af">No stops yet — add some below.</div>'; return; }
  el.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:4px">' + stops.sort((a,b)=>a.stop_order-b.stop_order).map((s,i) =>
    '<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#f7f6f2;border:1px solid #e2e0da;border-radius:6px;font-size:13px;color:#374151">'+
    '<strong style="color:#6b7280">'+(i+1)+'</strong> '+s.stop_name+(s.is_break_point?' 🛑':'')+'</span>'
  ).join('') + '</div>';
}

async function addStop() {
  if (!selectedRouteId) return;
  const name = document.getElementById('newStopName').value.trim();
  const isBreak = document.getElementById('newStopBreak').checked;
  if (!name) { showToast('Enter a stop name', true); return; }
  try {
    const r = await fetch(API + '/api/bus/stop', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({route_id:selectedRouteId,stop_name:name,is_break_point:isBreak}) });
    const d = await r.json();
    if (d.success) { stops.push({id:d.stop_id,stop_name:name,stop_order:d.stop_order,is_break_point:isBreak?1:0}); renderPreview(); document.getElementById('newStopName').value=''; document.getElementById('newStopBreak').checked=false; document.getElementById('newStopName').focus(); document.getElementById('startBtn').style.display='block'; }
    else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function startTrip() {
  if (!stops.length) { showToast('Add stops first', true); return; }
  const company = companies.find(c => c.id == selectedCompanyId);
  const route = routes.find(r => r.id == selectedRouteId);
  const companyName = company ? company.company_name : 'Bus';
  const routeName = route ? route.route_name : '';
  const origin = route ? (route.origin || '') : '';
  const dest = route ? (route.destination || '') : '';
  try {
    const r = await fetch(API + '/api/bus/start-trip', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company_name:companyName,route_name:routeName,origin:origin,destination:dest,stops:stops.map(s=>({id:s.id,stop_name:s.stop_name,stop_order:s.stop_order,is_break_point:s.is_break_point?true:false}))}) });
    const d = await r.json();
    if (d.success) {
      announcedIds = new Set();
      document.getElementById('selectSection').style.display = 'none';
      document.getElementById('announceSection').style.display = 'block';
      document.getElementById('tripBanner').style.display = 'block';
      document.getElementById('tripCompany').textContent = companyName;
      document.getElementById('tripRoute').textContent = (origin ? origin+' → ' : '') + (dest || routeName);
      document.getElementById('resetBtn').style.display = 'inline-block';
      renderTripStops();
      showToast('Trip started!');
    }
  } catch(e) { showToast('Network error', true); }
}

function renderTripStops() {
  const el = document.getElementById('tripStopList');
  el.innerHTML = stops.sort((a,b)=>a.stop_order-b.stop_order).map((s,i) => {
    const done = announcedIds.has(s.id);
    const cls = done ? ' done' : (s.is_break_point ? ' is-break' : '');
    return '<div class="trip-stop'+cls+'" onclick="'+(done?'':'announceStop('+s.id+',\''+s.stop_name.replace(/'/g,"\\'")+'\','+s.stop_order+','+(s.is_break_point?1:0)+')')+'">'+
      '<div class="trip-num">'+(i+1)+'</div>'+
      '<div class="trip-info">'+
      '<div class="trip-name">'+s.stop_name+'</div>'+
      '<div class="trip-status">'+(done?'✓ Announced':(s.is_break_point?'Break Point':'Tap to Announce'))+'</div>'+
      '</div>'+
      '<button class="trip-action">'+(done?'Done':'Announce')+'</button>'+
      '</div>';
  }).join('');
}

async function announceStop(id, name, order, isBreak) {
  try {
    const r = await fetch(API + '/api/bus/announce', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({stop_id:id,stop_name:name,stop_order:order,is_break_point:!!isBreak}) });
    const d = await r.json();
    if (d.success) { announcedIds.add(id); renderTripStops(); showToast('Announced: ' + name); }
  } catch(e) { showToast('Network error', true); }
}

async function resetTrip() {
  try {
    await fetch(API + '/api/bus/reset', { method:'POST' });
    announcedIds = new Set();
    document.getElementById('selectSection').style.display = 'block';
    document.getElementById('announceSection').style.display = 'none';
    document.getElementById('tripBanner').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'none';
    showToast('Trip reset');
  } catch(e) {}
}

loadCompanies();
</script>
</body>
</html>
