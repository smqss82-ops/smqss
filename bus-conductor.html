<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bus Conductor — SMQSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
.header{background:#fff;border-bottom:3px solid #d4aa00;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand svg{width:28px;height:28px;fill:#155c30}
.header-title{font-size:16px;font-weight:700;color:#155c30}.header-title span{color:#d4aa00}
.header-status{font-size:11px;padding:4px 10px;border-radius:20px;background:#e8f4ed;color:#155c30;font-weight:600}
.header-status.offline{background:#fdf0ef;color:#c0392b}
.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-bottom:80px}
.card{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
input[type=text],select{width:100%;padding:10px 12px;border:1.5px solid #e2e0da;border-radius:8px;font-size:15px;color:#1a1a1a;background:#f7f6f2;outline:none;font-family:inherit}
input[type=text]:focus,select:focus{border-color:#155c30;background:#fff}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.btn-primary{background:#155c30;color:#fff}.btn-primary:hover{background:#1e7d43}
.btn-gold{background:#d4aa00;color:#fff}.btn-gold:hover{background:#b8890a}
.btn-danger{background:transparent;color:#c0392b;border:1.5px solid #c0392b}.btn-danger:hover{background:#c0392b;color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;width:auto;display:inline-flex;align-items:center;gap:6px}
.form-row{display:flex;gap:10px}.form-row>*{flex:1}
.form-group{margin-bottom:10px}
.stop-list{display:flex;flex-direction:column;gap:6px}
.stop-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f7f6f2;border-radius:8px;border:1.5px solid #e2e0da;transition:all .2s}
.stop-item.announced{border-color:#155c30;background:#e8f4ed}
.stop-item.break-point{border-color:#d4aa00;background:#fdf3d8}
.stop-num{font-size:12px;font-weight:700;color:#fff;background:#6b7280;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop-item.announced .stop-num{background:#155c30}
.stop-item.break-point .stop-num{background:#d4aa00}
.stop-name{font-size:15px;font-weight:500;flex:1}
.stop-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase}
.stop-badge.rest{background:#d4aa00;color:#fff}
.stop-actions{display:flex;gap:6px;flex-shrink:0}
.announce-btn{padding:6px 14px;background:#155c30;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s}
.announce-btn:hover{background:#1e7d43}
.announce-btn:disabled{opacity:.4;cursor:not-allowed}
.announce-btn.active{background:#4ade80;color:#070d09}
.delete-btn{padding:6px 8px;background:transparent;color:#c0392b;border:1px solid #c0392b;border-radius:6px;font-size:12px;cursor:pointer}
.setup-step{display:none}.setup-step.active{display:block}
.step-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid #e2e0da}
.step-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.step-tab.active{color:#155c30;border-bottom-color:#155c30}
.trip-header{background:linear-gradient(135deg,#155c30,#1e7d43);color:#fff;border-radius:12px;padding:16px;text-align:center}
.trip-company{font-size:18px;font-weight:700}.trip-route{font-size:13px;opacity:.8;margin-top:2px}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e0da;padding:12px 16px;display:flex;gap:10px;z-index:50}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#155c30;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#c0392b}
</style>
</head>
<body>
<header class="header">
  <div class="header-brand">
    <svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
    <div class="header-title">SMQSS <span>Bus</span></div>
  </div>
  <div class="header-status" id="connStatus">Connected</div>
</header>

<main class="main">
  <!-- STEP TABS -->
  <div class="step-tabs">
    <div class="step-tab active" onclick="showStep('setup')">Setup Route</div>
    <div class="step-tab" onclick="showStep('trip')">Announce Stops</div>
  </div>

  <!-- STEP 1: SETUP -->
  <div class="setup-step active" id="step-setup">
    <!-- Existing company + route -->
    <div class="card" id="selectCard">
      <div class="card-title">Select Existing Route</div>
      <div class="form-group">
        <label>Bus Company</label>
        <select id="companySelect" onchange="loadRoutes()"><option value="">-- Select company --</option></select>
      </div>
      <div class="form-group">
        <label>Route</label>
        <select id="routeSelect" onchange="loadStops()"><option value="">-- Select route --</option></select>
      </div>
      <button class="btn btn-primary" onclick="startWithExisting()" id="startExistingBtn" disabled>Start Trip with This Route</button>
    </div>

    <div style="text-align:center;margin:8px 0;font-size:12px;color:#6b7280">— OR CREATE NEW —</div>

    <!-- Create company -->
    <div class="card">
      <div class="card-title">Bus Company</div>
      <div class="form-row">
        <div class="form-group"><label>Company Name</label><input type="text" id="newCompanyName" placeholder="e.g. Modern Coast"></div>
        <div class="form-group"><label>Code</label><input type="text" id="newCompanyCode" placeholder="e.g. MCD" maxlength="10" style="text-transform:uppercase"></div>
      </div>
      <div class="form-group"><label>Phone (optional)</label><input type="text" id="newCompanyPhone" placeholder="0700000000"></div>
      <button class="btn btn-sm btn-gold" onclick="createCompany()">Save Company</button>
    </div>

    <!-- Create route -->
    <div class="card">
      <div class="card-title">Route</div>
      <div class="form-group"><label>Route Name</label><input type="text" id="newRouteName" placeholder="e.g. Kampala - Jinja"></div>
      <div class="form-row">
        <div class="form-group"><label>Origin</label><input type="text" id="newRouteOrigin" placeholder="Kampala"></div>
        <div class="form-group"><label>Destination</label><input type="text" id="newRouteDest" placeholder="Jinja"></div>
      </div>
      <button class="btn btn-sm btn-gold" onclick="createRoute()">Save Route</button>
    </div>

    <!-- Add stops -->
    <div class="card">
      <div class="card-title">Add Stops</div>
      <div class="form-row">
        <div class="form-group" style="flex:2"><label>Stop Name</label><input type="text" id="newStopName" placeholder="e.g. Mukono Town"></div>
        <div class="form-group" style="flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end">
          <label style="text-align:center">Break?</label>
          <input type="checkbox" id="newStopBreak" style="width:20px;height:20px;margin:0">
        </div>
      </div>
      <button class="btn btn-sm btn-gold" onclick="addStop()">Add Stop</button>
      <div class="stop-list" id="setupStopList" style="margin-top:10px"></div>
      <button class="btn btn-primary" id="startNewBtn" onclick="startNewTrip()" style="margin-top:10px;display:none">Start Trip</button>
    </div>
  </div>

  <!-- STEP 2: TRIP / ANNOUNCE -->
  <div class="setup-step" id="step-trip">
    <div class="trip-header" id="tripHeader" style="display:none">
      <div class="trip-company" id="tripCompany"></div>
      <div class="trip-route" id="tripRoute"></div>
    </div>
    <div class="stop-list" id="tripStopList" style="margin-top:12px"></div>
    <div id="noTripMsg" style="text-align:center;padding:40px;color:#6b7280">Set up a route first in the Setup tab.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let companies = [], routes = [], stops = [];
let selectedCompanyId = null, selectedRouteId = null;
let tripStarted = false, announcedIds = new Set();

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

function showStep(step) {
  document.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.setup-step').forEach(s => s.classList.remove('active'));
  if (step === 'setup') { document.querySelectorAll('.step-tab')[0].classList.add('active'); document.getElementById('step-setup').classList.add('active'); }
  else { document.querySelectorAll('.step-tab')[1].classList.add('active'); document.getElementById('step-trip').classList.add('active'); }
}

async function loadCompanies() {
  try {
    const r = await fetch(API + '/api/bus/companies');
    const d = await r.json();
    if (d.success) {
      companies = d.companies;
      const sel = document.getElementById('companySelect');
      sel.innerHTML = '<option value="">-- Select company --</option>' + companies.map(c => '<option value="'+c.id+'">'+c.company_name+'</option>').join('');
    }
  } catch(e) {}
}

async function loadRoutes() {
  const cid = document.getElementById('companySelect').value;
  selectedCompanyId = cid || null;
  document.getElementById('routeSelect').innerHTML = '<option value="">-- Select route --</option>';
  document.getElementById('startExistingBtn').disabled = true;
  if (!cid) return;
  try {
    const r = await fetch(API + '/api/bus/routes/' + cid);
    const d = await r.json();
    if (d.success) {
      routes = d.routes;
      document.getElementById('routeSelect').innerHTML = '<option value="">-- Select route --</option>' + routes.map(r => '<option value="'+r.id+'">'+r.route_name+'</option>').join('');
    }
  } catch(e) {}
}

async function loadStops() {
  const rid = document.getElementById('routeSelect').value;
  selectedRouteId = rid || null;
  document.getElementById('startExistingBtn').disabled = !rid;
  if (!rid) return;
  try {
    const r = await fetch(API + '/api/bus/stops/' + rid);
    const d = await r.json();
    if (d.success) stops = d.stops;
  } catch(e) {}
}

async function createCompany() {
  const name = document.getElementById('newCompanyName').value.trim();
  const code = document.getElementById('newCompanyCode').value.trim();
  const phone = document.getElementById('newCompanyPhone').value.trim();
  if (!name || !code) { showToast('Name and code required', true); return; }
  try {
    const r = await fetch(API + '/api/bus/company', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company_name:name,company_code:code,contact_phone:phone}) });
    const d = await r.json();
    if (d.success) { showToast('Company saved!'); document.getElementById('newCompanyName').value=''; document.getElementById('newCompanyCode').value=''; document.getElementById('newCompanyPhone').value=''; loadCompanies(); }
    else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function createRoute() {
  if (!selectedCompanyId) { showToast('Select a company first', true); return; }
  const name = document.getElementById('newRouteName').value.trim();
  const origin = document.getElementById('newRouteOrigin').value.trim();
  const dest = document.getElementById('newRouteDest').value.trim();
  if (!name) { showToast('Route name required', true); return; }
  try {
    const r = await fetch(API + '/api/bus/route', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company_id:selectedCompanyId,route_name:name,origin:origin,destination:dest}) });
    const d = await r.json();
    if (d.success) { showToast('Route saved!'); selectedRouteId = d.route_id; document.getElementById('newRouteName').value=''; document.getElementById('newRouteOrigin').value=''; document.getElementById('newRouteDest').value=''; }
    else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function addStop() {
  if (!selectedRouteId) { showToast('Create or select a route first', true); return; }
  const name = document.getElementById('newStopName').value.trim();
  const isBreak = document.getElementById('newStopBreak').checked;
  if (!name) { showToast('Stop name required', true); return; }
  try {
    const r = await fetch(API + '/api/bus/stop', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({route_id:selectedRouteId,stop_name:name,is_break_point:isBreak}) });
    const d = await r.json();
    if (d.success) { stops.push({id:d.stop_id,stop_name:name,stop_order:d.stop_order,is_break_point:isBreak?1:0}); renderSetupStops(); document.getElementById('newStopName').value=''; document.getElementById('newStopBreak').checked=false; }
    else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function deleteStop(id) {
  try {
    await fetch(API + '/api/bus/stop/' + id, { method:'DELETE' });
    stops = stops.filter(s => s.id !== id);
    renderSetupStops();
  } catch(e) {}
}

function renderSetupStops() {
  const el = document.getElementById('setupStopList');
  if (!stops.length) { el.innerHTML = ''; document.getElementById('startNewBtn').style.display = 'none'; return; }
  document.getElementById('startNewBtn').style.display = 'block';
  el.innerHTML = stops.sort((a,b) => a.stop_order - b.stop_order).map((s,i) =>
    '<div class="stop-item'+(s.is_break_point?' break-point':'')+'">'+
    '<div class="stop-num">'+(i+1)+'</div>'+
    '<div class="stop-name">'+s.stop_name+'</div>'+
    (s.is_break_point?'<span class="stop-badge rest">Rest</span>':'')+
    '<button class="delete-btn" onclick="deleteStop('+s.id+')">&times;</button></div>'
  ).join('');
}

async function startWithExisting() {
  if (!selectedRouteId || !selectedCompanyId) return;
  const company = companies.find(c => c.id == selectedCompanyId);
  const route = routes.find(r => r.id == selectedRouteId);
  if (!company || !route || !stops.length) { showToast('Route has no stops', true); return; }
  await startTrip(company.company_name, route.route_name, route.origin||'', route.destination||'', stops);
}

async function startNewTrip() {
  if (!stops.length) { showToast('Add stops first', true); return; }
  const name = document.getElementById('newCompanyName').value.trim() || (companies.find(c=>c.id==selectedCompanyId)||{}).company_name || 'Bus';
  const routeName = document.getElementById('newRouteName').value.trim() || 'Current Route';
  const origin = document.getElementById('newRouteOrigin').value.trim();
  const dest = document.getElementById('newRouteDest').value.trim();
  await startTrip(name, routeName, origin, dest, stops);
}

async function startTrip(companyName, routeName, origin, destination, stopList) {
  try {
    const r = await fetch(API + '/api/bus/start-trip', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company_name:companyName,route_name:routeName,origin:origin,destination:destination,stops:stopList.map(s=>({id:s.id,stop_name:s.stop_name,stop_order:s.stop_order,is_break_point:s.is_break_point?true:false}))}) });
    const d = await r.json();
    if (d.success) {
      tripStarted = true; announcedIds = new Set();
      document.getElementById('tripCompany').textContent = companyName;
      document.getElementById('tripRoute').textContent = (origin ? origin+' → ' : '') + (destination || routeName);
      document.getElementById('tripHeader').style.display = 'block';
      document.getElementById('noTripMsg').style.display = 'none';
      renderTripStops();
      showStep('trip');
      showToast('Trip started!');
    }
  } catch(e) { showToast('Network error', true); }
}

function renderTripStops() {
  const el = document.getElementById('tripStopList');
  el.innerHTML = stops.sort((a,b)=>a.stop_order-b.stop_order).map((s,i) => {
    const done = announcedIds.has(s.id);
    const cls = done ? ' announced' : (s.is_break_point ? ' break-point' : '');
    return '<div class="stop-item'+cls+'">'+
      '<div class="stop-num">'+(i+1)+'</div>'+
      '<div class="stop-name">'+s.stop_name+'</div>'+
      (s.is_break_point?'<span class="stop-badge rest">Rest</span>':'')+
      '<div class="stop-actions">'+
      (done ? '<span style="font-size:12px;color:#155c30;font-weight:700">✓ Done</span>' :
        '<button class="announce-btn" onclick="announceStop('+s.id+',\''+s.stop_name.replace(/'/g,"\\'")+'\','+s.stop_order+','+(s.is_break_point?1:0)+')">Announce</button>')+
      '</div></div>';
  }).join('');
}

async function announceStop(id, name, order, isBreak) {
  try {
    const r = await fetch(API + '/api/bus/announce', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({stop_id:id,stop_name:name,stop_order:order,is_break_point:!!isBreak}) });
    const d = await r.json();
    if (d.success) {
      announcedIds.add(id);
      renderTripStops();
      showToast('Announced: ' + name);
    }
  } catch(e) { showToast('Network error', true); }
}

loadCompanies();
</script>
</body>
</html>
