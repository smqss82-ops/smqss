<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bus Conductor — SMQSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
.header{background:#fff;border-bottom:3px solid #d4aa00;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand svg{width:28px;height:28px;fill:#155c30}
.header-title{font-size:16px;font-weight:700;color:#155c30}.header-title span{color:#d4aa00}
.header-status{font-size:11px;padding:4px 10px;border-radius:20px;background:#e8f4ed;color:#155c30;font-weight:600}
.header-status.offline{background:#fdf0ef;color:#c0392b}
.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-bottom:80px}
.card{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
input[type=text],select{width:100%;padding:10px 12px;border:1.5px solid #e2e0da;border-radius:8px;font-size:15px;color:#1a1a1a;background:#f7f6f2;outline:none;font-family:inherit}
input[type=text]:focus,select:focus{border-color:#155c30;background:#fff}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.btn-primary{background:#155c30;color:#fff}.btn-primary:hover{background:#1e7d43}
.btn-gold{background:#d4aa00;color:#fff}.btn-gold:hover{background:#b8890a}
.btn-sm{padding:8px 16px;font-size:13px;width:auto;display:inline-flex;align-items:center;gap:6px}
.form-row{display:flex;gap:10px}.form-row>*{flex:1}
.form-group{margin-bottom:10px}

.inline-toggle{display:flex;align-items:center;gap:8px;margin-top:6px}
.inline-toggle-btn{font-size:12px;font-weight:700;color:#d4aa00;cursor:pointer;border:none;background:none;padding:0;font-family:inherit}
.inline-toggle-btn:hover{text-decoration:underline}
.inline-create{display:none;margin-top:10px;padding:10px;background:#fdf3d8;border-radius:8px;border:1px solid rgba(212,170,0,0.2)}
.inline-create.show{display:block}
.inline-create .form-row{gap:8px}
.inline-create input{padding:8px 10px;font-size:13px}

.toggle-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.toggle-label{font-size:14px;font-weight:600;color:#374151;flex:1}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#d1d5db;border-radius:24px;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:#155c30}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px)}

.stop-add-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.stop-add-row .stop-input-wrap{flex:1}
.stop-add-row .stop-input-wrap input{font-size:16px;padding:12px}
.stop-add-row .add-btn{padding:12px 20px;background:#155c30;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:46px}
.stop-add-row .add-btn:hover{background:#1e7d43}

.stop-list{display:flex;flex-direction:column;gap:6px}
.stop-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:10px;border:1.5px solid #e2e0da;transition:all .2s}
.stop-item.announced{border-color:#155c30;background:#e8f4ed}
.stop-item.break-point{border-color:#d4aa00;background:#fdf3d8}
.stop-num{font-size:16px;font-weight:800;color:#fff;background:#6b7280;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop-item.announced .stop-num{background:#155c30}
.stop-item.break-point .stop-num{background:#d4aa00}
.stop-name{font-size:18px;font-weight:600;flex:1}
.stop-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;text-transform:uppercase}
.stop-badge.rest{background:#d4aa00;color:#fff}
.stop-actions{display:flex;gap:6px;flex-shrink:0}
.delete-btn{padding:6px 10px;background:transparent;color:#c0392b;border:1px solid #c0392b;border-radius:6px;font-size:14px;cursor:pointer}

.setup-step{display:none}.setup-step.active{display:block}
.step-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid #e2e0da}
.step-tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:600;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.step-tab.active{color:#155c30;border-bottom-color:#155c30}

.trip-header{background:linear-gradient(135deg,#155c30,#1e7d43);color:#fff;border-radius:12px;padding:18px;text-align:center}
.trip-company{font-size:20px;font-weight:700}.trip-route{font-size:14px;opacity:.8;margin-top:2px}

.announce-card{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:12px;border:2px solid #e2e0da;transition:all .2s;cursor:pointer}
.announce-card:active{transform:scale(0.98)}
.announce-card.done{border-color:#155c30;background:#e8f4ed}
.announce-card.break-card{border-color:#d4aa00;background:#fdf3d8}
.announce-card.done.break-card{border-color:#155c30;background:#e8f4ed}
.announce-num{font-size:22px;font-weight:900;color:#fff;background:#6b7280;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.announce-card.done .announce-num{background:#155c30}
.announce-card.break-card .announce-num{background:#d4aa00}
.announce-card.done.break-card .announce-num{background:#155c30}
.announce-info{flex:1}
.announce-name{font-size:20px;font-weight:700;color:#1a1a1a}
.announce-card.done .announce-name{color:#155c30}
.announce-status{font-size:12px;color:#6b7280;margin-top:2px}
.announce-card.done .announce-status{color:#155c30;font-weight:600}
.announce-action{padding:12px 20px;background:#155c30;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;min-width:100px}
.announce-card.done .announce-action{background:#e8f4ed;color:#155c30}
.announce-card:active .announce-action{transform:scale(0.95)}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#155c30;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#c0392b}
</style>
</head>
<body>
<header class="header">
  <div class="header-brand">
    <svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
    <div class="header-title">SMQSS <span>Bus</span></div>
  </div>
  <div class="header-status" id="connStatus">Connected</div>
</header>

<main class="main">
  <div class="step-tabs">
    <div class="step-tab active" onclick="showStep('setup')">Setup Route</div>
    <div class="step-tab" onclick="showStep('trip')">Announce Stops</div>
  </div>

  <!-- STEP 1: SETUP -->
  <div class="setup-step active" id="step-setup">
    <!-- Company selection -->
    <div class="card">
      <div class="card-title">Bus Company</div>
      <select id="companySelect" onchange="onCompanyChange()"><option value="">-- Select company --</option></select>
      <div class="inline-toggle">
        <span style="font-size:12px;color:#6b7280">New company?</span>
        <button class="inline-toggle-btn" onclick="toggleNewCompany()">+ Create New</button>
      </div>
      <div class="inline-create" id="newCompanyForm">
        <div class="form-row">
          <div class="form-group"><label>Company Name</label><input type="text" id="newCompanyName" placeholder="e.g. Modern Coast"></div>
          <div class="form-group" style="flex:0 0 100px"><label>Code</label><input type="text" id="newCompanyCode" placeholder="MCD" maxlength="10" style="text-transform:uppercase"></div>
        </div>
        <div class="form-group"><label>Phone (optional)</label><input type="text" id="newCompanyPhone" placeholder="0700000000"></div>
        <button class="btn btn-sm btn-gold" onclick="createCompany()" style="width:100%">Save Company</button>
      </div>
    </div>

    <!-- Route selection -->
    <div class="card">
      <div class="card-title">Route</div>
      <select id="routeSelect" onchange="onRouteChange()"><option value="">-- Select route --</option></select>
      <div class="inline-toggle">
        <span style="font-size:12px;color:#6b7280">New route?</span>
        <button class="inline-toggle-btn" onclick="toggleNewRoute()">+ Create New</button>
      </div>
      <div class="inline-create" id="newRouteForm">
        <div class="form-group"><label>Route Name</label><input type="text" id="newRouteName" placeholder="e.g. Kampala - Jinja"></div>
        <div class="form-row">
          <div class="form-group"><label>From</label><input type="text" id="newRouteOrigin" placeholder="Kampala"></div>
          <div class="form-group"><label>To</label><input type="text" id="newRouteDest" placeholder="Jinja"></div>
        </div>
        <button class="btn btn-sm btn-gold" onclick="createRoute()" style="width:100%">Save Route</button>
      </div>
    </div>

    <!-- Add stops -->
    <div class="card" id="stopsCard">
      <div class="card-title">Add Stop Points</div>
      <div class="stop-add-row">
        <div class="stop-input-wrap">
          <input type="text" id="newStopName" placeholder="Type stop name...">
        </div>
        <button class="add-btn" onclick="addStop()">+ Add</button>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Rest Break Point?</span>
        <label class="toggle"><input type="checkbox" id="newStopBreak"><span class="toggle-slider"></span></label>
      </div>
      <div class="stop-list" id="setupStopList"></div>
      <button class="btn btn-primary" id="startNewBtn" onclick="startNewTrip()" style="margin-top:12px;display:none">Start Trip</button>
    </div>
  </div>

  <!-- STEP 2: ANNOUNCE -->
  <div class="setup-step" id="step-trip">
    <div class="trip-header" id="tripHeader" style="display:none">
      <div class="trip-company" id="tripCompany"></div>
      <div class="trip-route" id="tripRoute"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px" id="tripStopList"></div>
    <div id="noTripMsg" style="text-align:center;padding:40px;color:#6b7280">Set up a route first in the Setup tab.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let companies = [], routes = [], stops = [];
let selectedCompanyId = null, selectedRouteId = null;
let tripStarted = false, announcedIds = new Set();

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

function showStep(step) {
  document.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.setup-step').forEach(s => s.classList.remove('active'));
  if (step === 'setup') { document.querySelectorAll('.step-tab')[0].classList.add('active'); document.getElementById('step-setup').classList.add('active'); }
  else { document.querySelectorAll('.step-tab')[1].classList.add('active'); document.getElementById('step-trip').classList.add('active'); }
}

function toggleNewCompany() {
  const f = document.getElementById('newCompanyForm');
  f.classList.toggle('show');
  if (f.classList.contains('show')) document.getElementById('newCompanyName').focus();
}

function toggleNewRoute() {
  const f = document.getElementById('newRouteForm');
  f.classList.toggle('show');
  if (f.classList.contains('show')) document.getElementById('newRouteName').focus();
}

function onCompanyChange() {
  const cid = document.getElementById('companySelect').value;
  selectedCompanyId = cid || null;
  selectedRouteId = null;
  document.getElementById('routeSelect').innerHTML = '<option value="">-- Select route --</option>';
  if (!cid) return;
  loadRoutes();
}

function onRouteChange() {
  const rid = document.getElementById('routeSelect').value;
  selectedRouteId = rid || null;
  if (!rid) { stops = []; renderSetupStops(); return; }
  loadStops();
}

async function loadCompanies() {
  try {
    const r = await fetch(API + '/api/bus/companies');
    const d = await r.json();
    if (d.success) {
      companies = d.companies;
      document.getElementById('companySelect').innerHTML = '<option value="">-- Select company --</option>' + companies.map(c => '<option value="'+c.id+'">'+c.company_name+'</option>').join('');
    }
  } catch(e) {}
}

async function loadRoutes() {
  if (!selectedCompanyId) return;
  try {
    const r = await fetch(API + '/api/bus/routes/' + selectedCompanyId);
    const d = await r.json();
    if (d.success) {
      routes = d.routes;
      document.getElementById('routeSelect').innerHTML = '<option value="">-- Select route --</option>' + routes.map(r => '<option value="'+r.id+'">'+r.route_name+'</option>').join('');
    }
  } catch(e) {}
}

async function loadStops() {
  if (!selectedRouteId) return;
  try {
    const r = await fetch(API + '/api/bus/stops/' + selectedRouteId);
    const d = await r.json();
    if (d.success) { stops = d.stops; renderSetupStops(); }
  } catch(e) {}
}

async function createCompany() {
  const name = document.getElementById('newCompanyName').value.trim();
  const code = document.getElementById('newCompanyCode').value.trim();
  const phone = document.getElementById('newCompanyPhone').value.trim();
  if (!name || !code) { showToast('Name and code required', true); return; }
  try {
    const r = await fetch(API + '/api/bus/company', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company_name:name,company_code:code,contact_phone:phone}) });
    const d = await r.json();
    if (d.success) {
      showToast('Company saved!');
      document.getElementById('newCompanyName').value=''; document.getElementById('newCompanyCode').value=''; document.getElementById('newCompanyPhone').value='';
      document.getElementById('newCompanyForm').classList.remove('show');
      await loadCompanies();
      document.getElementById('companySelect').value = d.company_id;
      selectedCompanyId = d.company_id;
    } else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function createRoute() {
  if (!selectedCompanyId) { showToast('Select a company first', true); return; }
  const name = document.getElementById('newRouteName').value.trim();
  const origin = document.getElementById('newRouteOrigin').value.trim();
  const dest = document.getElementById('newRouteDest').value.trim();
  if (!name) { showToast('Route name required', true); return; }
  try {
    const r = await fetch(API + '/api/bus/route', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({company_id:selectedCompanyId,route_name:name,origin:origin,destination:dest}) });
    const d = await r.json();
    if (d.success) {
      showToast('Route saved!');
      selectedRouteId = d.route_id;
      document.getElementById('newRouteName').value=''; document.getElementById('newRouteOrigin').value=''; document.getElementById('newRouteDest').value='';
      document.getElementById('newRouteForm').classList.remove('show');
      await loadRoutes();
      document.getElementById('routeSelect').value = d.route_id;
    } else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function addStop() {
  if (!selectedRouteId) { showToast('Select or create a route first', true); return; }
  const name = document.getElementById('newStopName').value.trim();
  const isBreak = document.getElementById('newStopBreak').checked;
  if (!name) { showToast('Stop name required', true); return; }
  try {
    const r = await fetch(API + '/api/bus/stop', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({route_id:selectedRouteId,stop_name:name,is_break_point:isBreak}) });
    const d = await r.json();
    if (d.success) { stops.push({id:d.stop_id,stop_name:name,stop_order:d.stop_order,is_break_point:isBreak?1:0}); renderSetupStops(); document.getElementById('newStopName').value=''; document.getElementById('newStopBreak').checked=false; document.getElementById('newStopName').focus(); }
    else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function deleteStop(id) {
  try { await fetch(API + '/api/bus/stop/' + id, { method:'DELETE' }); stops = stops.filter(s => s.id !== id); renderSetupStops(); } catch(e) {}
}

function renderSetupStops() {
  const el = document.getElementById('setupStopList');
  if (!stops.length) { el.innerHTML = ''; document.getElementById('startNewBtn').style.display = 'none'; return; }
  document.getElementById('startNewBtn').style.display = 'block';
  el.innerHTML = stops.sort((a,b) => a.stop_order - b.stop_order).map((s,i) =>
    '<div class="stop-item'+(s.is_break_point?' break-point':'')+'">'+
    '<div class="stop-num">'+(i+1)+'</div>'+
    '<div class="stop-name">'+s.stop_name+'</div>'+
    (s.is_break_point?'<span class="stop-badge rest">Break</span>':'')+
    '<button class="delete-btn" onclick="deleteStop('+s.id+')">&times;</button></div>'
  ).join('');
}

async function startNewTrip() {
  if (!stops.length) { showToast('Add stops first', true); return; }
  const company = companies.find(c => c.id == selectedCompanyId);
  const route = routes.find(r => r.id == selectedRouteId);
  const companyName = company ? company.company_name : 'Bus';
  const routeName = route ? route.route_name : 'Current Route';
  const origin = route ? (route.origin || '') : '';
  const dest = route ? (route.destination || '') : '';
  await startTrip(companyName, routeName, origin, dest, stops);
}

async function startTrip(companyName, routeName, origin, destination, stopList) {
  try {
    const r = await fetch(API + '/api/bus/start-trip', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company_name:companyName,route_name:routeName,origin:origin,destination:destination,stops:stopList.map(s=>({id:s.id,stop_name:s.stop_name,stop_order:s.stop_order,is_break_point:s.is_break_point?true:false}))}) });
    const d = await r.json();
    if (d.success) {
      tripStarted = true; announcedIds = new Set();
      document.getElementById('tripCompany').textContent = companyName;
      document.getElementById('tripRoute').textContent = (origin ? origin+' → ' : '') + (destination || routeName);
      document.getElementById('tripHeader').style.display = 'block';
      document.getElementById('noTripMsg').style.display = 'none';
      renderTripStops();
      showStep('trip');
      showToast('Trip started!');
    }
  } catch(e) { showToast('Network error', true); }
}

function renderTripStops() {
  const el = document.getElementById('tripStopList');
  el.innerHTML = stops.sort((a,b)=>a.stop_order-b.stop_order).map((s,i) => {
    const done = announcedIds.has(s.id);
    const cls = done ? ' done' : (s.is_break_point ? ' break-card' : '');
    return '<div class="announce-card'+cls+'" onclick="'+(done?'':'announceStop('+s.id+',\''+s.stop_name.replace(/'/g,"\\'")+'\','+s.stop_order+','+(s.is_break_point?1:0)+')')+'">'+
      '<div class="announce-num">'+(i+1)+'</div>'+
      '<div class="announce-info">'+
      '<div class="announce-name">'+s.stop_name+'</div>'+
      '<div class="announce-status">'+(done?'✓ Announced':(s.is_break_point?'Break Point':'Stop Point'))+'</div>'+
      '</div>'+
      '<button class="announce-action">'+(done?'Done':'Announce')+'</button>'+
      '</div>';
  }).join('');
}

async function announceStop(id, name, order, isBreak) {
  try {
    const r = await fetch(API + '/api/bus/announce', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({stop_id:id,stop_name:name,stop_order:order,is_break_point:!!isBreak}) });
    const d = await r.json();
    if (d.success) { announcedIds.add(id); renderTripStops(); showToast('Announced: ' + name); }
  } catch(e) { showToast('Network error', true); }
}

loadCompanies();
</script>
</body>
</html>
