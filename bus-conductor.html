<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bus Conductor — SMQSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
.header{background:#fff;border-bottom:3px solid #d4aa00;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand svg{width:28px;height:28px;fill:#155c30}
.header-title{font-size:16px;font-weight:700;color:#155c30}.header-title span{color:#d4aa00}
.header-status{font-size:11px;padding:4px 10px;border-radius:20px;background:#e8f4ed;color:#155c30;font-weight:600}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen{display:none;flex:1;flex-direction:column;padding:16px;gap:12px;overflow-y:auto;animation:slideIn .25s ease}
.screen.active{display:flex}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.screen-back{display:flex;align-items:center;gap:8px;padding:4px 0;margin-bottom:4px;cursor:pointer;color:#6b7280;font-size:14px;font-weight:600;border:none;background:none;font-family:inherit}
.screen-back:hover{color:#155c30}
.screen-back svg{width:20px;height:20px;fill:currentColor}
.screen-title{font-size:13px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.company-card{background:#fff;border:2px solid #e2e0da;border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .2s}
.company-card:active{transform:scale(0.96);border-color:#155c30}
.company-card-icon{width:48px;height:48px;background:linear-gradient(135deg,#155c30,#1e7d43);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#fff;font-size:20px;font-weight:900}
.company-card-name{font-size:16px;font-weight:700;color:#1a1a1a}
.company-card-code{font-size:12px;color:#6b7280;margin-top:2px}
.route-card{background:#fff;border:2px solid #e2e0da;border-radius:12px;padding:16px;cursor:pointer;transition:all .2s}
.route-card:active{transform:scale(0.98);border-color:#155c30}
.route-card-name{font-size:18px;font-weight:700;color:#1a1a1a}
.route-card-meta{font-size:13px;color:#6b7280;margin-top:4px}
.route-card-actions{display:flex;gap:8px;margin-top:10px}
.route-btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .2s}
.route-btn-edit{background:#fff;color:#155c30;border-color:#155c30}
.route-btn-edit:active{background:#155c30;color:#fff}
.route-btn-delete{background:#fff;color:#c0392b;border-color:#c0392b}
.route-btn-delete:active{background:#c0392b;color:#fff}
.route-edit-form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.route-edit-form input{padding:10px;border:1.5px solid #e2e0da;border-radius:8px;font-size:14px;font-family:inherit}
.route-edit-actions{display:flex;gap:8px}
.route-edit-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:#155c30;color:#fff}.btn-primary:hover{background:#1e7d43}
.stop-list{display:flex;flex-direction:column;gap:6px}
.stop-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:10px;border:1.5px solid #e2e0da}
.stop-item.break-point{border-color:#d4aa00;background:#fdf3d8}
.stop-num{font-size:16px;font-weight:800;color:#fff;background:#6b7280;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop-item.break-point .stop-num{background:#d4aa00}
.stop-name{font-size:17px;font-weight:600;flex:1}
.stop-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;text-transform:uppercase;background:#d4aa00;color:#fff}
.delete-btn{width:28px;height:28px;background:transparent;color:#c0392b;border:1px solid #c0392b;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-stop-row{display:flex;gap:8px;align-items:flex-end;margin-top:4px}
.add-stop-row input{flex:1;font-size:16px;padding:12px}
.add-stop-btn{padding:12px 18px;background:#155c30;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.add-stop-btn:hover{background:#1e7d43}
.toggle-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.toggle-label{font-size:14px;font-weight:600;color:#374151;flex:1}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#d1d5db;border-radius:24px;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:#155c30}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px)}
.trip-banner{background:linear-gradient(135deg,#155c30,#1e7d43);color:#fff;border-radius:12px;padding:16px;text-align:center}
.trip-company{font-size:20px;font-weight:700}
.trip-route{font-size:14px;opacity:.8;margin-top:2px}
.announce-card{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:12px;border:2px solid #e2e0da;cursor:pointer;transition:all .2s}
.announce-card:active{transform:scale(0.98)}
.announce-card.done{border-color:#155c30;background:#e8f4ed}
.announce-card.is-break{border-color:#d4aa00;background:#fdf3d8}
.announce-card.done.is-break{border-color:#155c30;background:#e8f4ed}
.announce-num{font-size:22px;font-weight:900;color:#fff;background:#9ca3af;width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.announce-card.done .announce-num{background:#155c30}
.announce-card.is-break .announce-num{background:#d4aa00}
.announce-card.done.is-break .announce-num{background:#155c30}
.announce-info{flex:1}
.announce-name{font-size:20px;font-weight:700;color:#1a1a1a}
.announce-card.done .announce-name{color:#155c30}
.announce-status{font-size:12px;color:#6b7280;margin-top:2px}
.announce-card.done .announce-status{color:#155c30;font-weight:600}
.announce-action{padding:12px 20px;background:#155c30;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;min-width:100px}
.announce-card.done .announce-action{background:#e8f4ed;color:#155c30}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#155c30;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#c0392b}
.ad-card{position:relative;border-radius:12px;overflow:hidden;border:2px solid #e2e0da;background:#fff}
.ad-card img{width:100%;height:140px;object-fit:cover;display:block}
.ad-card-delete{position:absolute;top:6px;right:6px;width:28px;height:28px;background:rgba(192,57,43,0.9);color:#fff;border:none;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ad-card-name{padding:8px 10px;font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header class="header">
  <div class="header-brand">
    <svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
    <div class="header-title">SMQSS <span>Bus</span></div>
  </div>
  <div class="header-status">Connected</div>
</header>

<main class="main">

  <!-- SCREEN 1: PICK COMPANY -->
  <div class="screen active" id="screen1">
    <div class="screen-title">Your Companies</div>
    <div class="card-grid" id="companyGrid"></div>
    <button class="btn btn-primary" onclick="loadAds();showScreen('screen5')" style="margin-top:12px;background:#d4aa00">Manage TV Ads</button>
  </div>

  <!-- SCREEN 2: PICK ROUTE -->
  <div class="screen" id="screen2">
    <button class="screen-back" onclick="showScreen('screen1')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back</button>
    <div class="screen-title" id="screen2Title">Routes</div>
    <div id="routeList" style="display:flex;flex-direction:column;gap:8px"></div>
    <div style="margin-top:12px">
      <div class="screen-title">Add New Route</div>
      <input type="text" id="newRouteName" placeholder="Route name" style="width:100%;padding:12px;border:1.5px solid #e2e0da;border-radius:10px;font-size:16px;font-family:inherit;margin-bottom:8px">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input type="text" id="newRouteOrigin" placeholder="Origin (optional)" style="flex:1;padding:12px;border:1.5px solid #e2e0da;border-radius:10px;font-size:16px;font-family:inherit">
        <input type="text" id="newRouteDest" placeholder="Destination (optional)" style="flex:1;padding:12px;border:1.5px solid #e2e0da;border-radius:10px;font-size:16px;font-family:inherit">
      </div>
      <button class="btn btn-primary" onclick="addRoute()" style="width:100%">+ Add Route</button>
    </div>
  </div>

  <!-- SCREEN 3: ADD STOPS -->
  <div class="screen" id="screen3">
    <button class="screen-back" onclick="showScreen('screen2')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back</button>
    <div class="screen-title" id="screen3Title">Stop Points</div>
    <div class="stop-list" id="stopList"></div>
    <div class="add-stop-row">
      <input type="text" id="newStopName" placeholder="Type stop name...">
      <button class="add-stop-btn" onclick="addStop()">+ Add</button>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Rest Break Point</span>
      <label class="toggle"><input type="checkbox" id="newStopBreak"><span class="toggle-slider"></span></label>
    </div>
    <button class="btn btn-primary" id="startBtn" onclick="startTrip()" style="margin-top:8px;display:none">Start Trip</button>
  </div>

  <!-- SCREEN 4: ANNOUNCE -->
  <div class="screen" id="screen4">
    <button class="screen-back" onclick="endTrip()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>End Trip</button>
    <div class="trip-banner">
      <div class="trip-company" id="tripCompany"></div>
      <div class="trip-route" id="tripRoute"></div>
    </div>
    <div id="announceList" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>

  <!-- SCREEN 5: MANAGE ADS -->
  <div class="screen" id="screen5">
    <button class="screen-back" onclick="showScreen('screen1')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back</button>
    <div class="screen-title">Manage TV Ads</div>
    <div class="screen-title" style="font-size:12px;color:#9ca3af;text-transform:none;letter-spacing:0;margin-bottom:8px">These images show on the TV screen when no trip is active.</div>
    <div id="adGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
    <div style="margin-top:12px">
      <input type="file" id="adFileInput" accept="image/*" style="display:none" onchange="uploadAd()">
      <button class="btn btn-primary" onclick="document.getElementById('adFileInput').click()">+ Upload Ad Image</button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let companies = [], routes = [], stops = [];
let selectedCompanyId = null, selectedRouteId = null;
let announcedIds = new Set();

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── SCREEN 1: COMPANIES ──

async function loadCompanies() {
  try {
    const r = await fetch(API + '/api/bus/companies');
    const d = await r.json();
    if (d.success) { companies = d.companies; renderCompanies(); }
  } catch(e) {}
}

function renderCompanies() {
  const grid = document.getElementById('companyGrid');
  grid.innerHTML = companies.map(c =>
    '<div class="company-card" onclick="selectCompany('+c.id+')">'+
    '<div class="company-card-icon">'+c.company_name.charAt(0)+'</div>'+
    '<div class="company-card-name">'+c.company_name+'</div>'+
    (c.company_code?'<div class="company-card-code">'+c.company_code+'</div>':'')+
    '</div>'
  ).join('');
}

function selectCompany(id) {
  selectedCompanyId = id;
  selectedRouteId = null;
  const c = companies.find(x => x.id == id);
  document.getElementById('screen2Title').textContent = (c ? c.company_name : '') + ' — Routes';
  loadRoutes();
  showScreen('screen2');
}

// ── SCREEN 2: ROUTES ──

async function loadRoutes() {
  if (!selectedCompanyId) return;
  try {
    const r = await fetch(API + '/api/bus/routes/' + selectedCompanyId);
    const d = await r.json();
    if (d.success) { routes = d.routes; renderRoutes(); }
  } catch(e) {}
}

async function addRoute() {
  if (!selectedCompanyId) return;
  const name = document.getElementById('newRouteName').value.trim();
  const origin = document.getElementById('newRouteOrigin').value.trim();
  const dest = document.getElementById('newRouteDest').value.trim();
  if (!name) { showToast('Enter a route name', true); return; }
  try {
    const r = await fetch(API+'/api/bus/route', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company_id:selectedCompanyId, route_name:name, origin:origin, destination:dest}) });
    const d = await r.json();
    if (d.success) {
      routes.push({id:d.route_id, route_name:name, origin:origin||null, destination:dest||null});
      renderRoutes();
      document.getElementById('newRouteName').value = '';
      document.getElementById('newRouteOrigin').value = '';
      document.getElementById('newRouteDest').value = '';
      showToast('Route added');
    } else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

function renderRoutes() {
  const el = document.getElementById('routeList');
  if (!routes.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:#9ca3af">No routes yet. Add one below.</div>'; return; }
  el.innerHTML = routes.map(r => {
    const meta = [r.origin, r.destination].filter(Boolean).join(' → ');
    return '<div class="route-card" id="routeCard-'+r.id+'">'+
    '<div class="route-card-name">'+r.route_name+'</div>'+
    (meta?'<div class="route-card-meta">'+meta+'</div>':'')+
    '<div class="route-card-actions">'+
    '<button class="route-btn route-btn-edit" onclick="event.stopPropagation();startEditRoute('+r.id+')">Edit</button>'+
    '<button class="route-btn route-btn-delete" onclick="event.stopPropagation();deleteRoute('+r.id+',\''+r.route_name.replace(/'/g,"\\'")+'\')">Delete</button>'+
    '</div>'+
    '</div>';
  }).join('');
}

function selectRoute(id) {
  selectedRouteId = id;
  const r = routes.find(x => x.id == id);
  document.getElementById('screen3Title').textContent = (r ? r.route_name : '') + ' - Stop Points';
  loadStops();
  showScreen('screen3');
}

function startEditRoute(id) {
  const r = routes.find(x => x.id == id);
  if (!r) return;
  const card = document.getElementById('routeCard-'+id);
  if (!card) return;
  card.innerHTML = '<div class="route-edit-form">'+
    '<input type="text" id="editRouteName-'+id+'" value="'+r.route_name.replace(/"/g,'&quot;')+'" placeholder="Route name">'+
    '<input type="text" id="editRouteOrigin-'+id+'" value="'+(r.origin||'').replace(/"/g,'&quot;')+'" placeholder="Origin (optional)">'+
    '<input type="text" id="editRouteDest-'+id+'" value="'+(r.destination||'').replace(/"/g,'&quot;')+'" placeholder="Destination (optional)">'+
    '<div class="route-edit-actions">'+
    '<button class="route-btn" style="background:#155c30;color:#fff;border-color:#155c30" onclick="saveEditRoute('+id+')">Save</button>'+
    '<button class="route-btn" style="background:#fff;color:#6b7280;border-color:#d1d5db" onclick="renderRoutes()">Cancel</button>'+
    '</div>'+
    '</div>';
  document.getElementById('editRouteName-'+id).focus();
}

async function saveEditRoute(id) {
  const name = document.getElementById('editRouteName-'+id).value.trim();
  const origin = document.getElementById('editRouteOrigin-'+id).value.trim();
  const dest = document.getElementById('editRouteDest-'+id).value.trim();
  if (!name) { showToast('Route name required', true); return; }
  try {
    const r = await fetch(API+'/api/bus/route/'+id, { method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({route_name:name, origin:origin, destination:dest}) });
    const d = await r.json();
    if (d.success) {
      const route = routes.find(x => x.id == id);
      if (route) { route.route_name = name; route.origin = origin || null; route.destination = dest || null; }
      renderRoutes();
      showToast('Route updated');
    } else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function deleteRoute(id, name) {
  if (!confirm('Delete route "'+name+'"? All stops will also be removed.')) return;
  try {
    const r = await fetch(API+'/api/bus/route/'+id, { method:'DELETE' });
    const d = await r.json();
    if (d.success) {
      routes = routes.filter(x => x.id !== id);
      renderRoutes();
      showToast('Route deleted');
    } else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

// ── SCREEN 3: STOPS ──

async function loadStops() {
  if (!selectedRouteId) return;
  try {
    const r = await fetch(API + '/api/bus/stops/' + selectedRouteId);
    const d = await r.json();
    if (d.success) { stops = d.stops; renderStops(); }
  } catch(e) {}
}

function renderStops() {
  const el = document.getElementById('stopList');
  const btn = document.getElementById('startBtn');
  if (!stops.length) { el.innerHTML = '<div style="padding:16px;text-align:center;color:#9ca3af;font-size:14px">No stops yet. Add your first stop below.</div>'; btn.style.display='none'; return; }
  btn.style.display = 'block';
  el.innerHTML = stops.sort((a,b) => a.stop_order - b.stop_order).map((s,i) =>
    '<div class="stop-item'+(s.is_break_point?' break-point':'')+'">'+
    '<div class="stop-num">'+(i+1)+'</div>'+
    '<div class="stop-name">'+s.stop_name+'</div>'+
    (s.is_break_point?'<span class="stop-badge">Break</span>':'')+
    '<button class="delete-btn" onclick="deleteStop('+s.id+')">&times;</button></div>'
  ).join('');
}

async function addStop() {
  if (!selectedRouteId) return;
  const name = document.getElementById('newStopName').value.trim();
  const isBreak = document.getElementById('newStopBreak').checked;
  if (!name) { showToast('Enter a stop name', true); return; }
  try {
    const r = await fetch(API + '/api/bus/stop', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({route_id:selectedRouteId,stop_name:name,is_break_point:isBreak}) });
    const d = await r.json();
    if (d.success) { stops.push({id:d.stop_id,stop_name:name,stop_order:d.stop_order,is_break_point:isBreak?1:0}); renderStops(); document.getElementById('newStopName').value=''; document.getElementById('newStopName').focus(); }
    else showToast(d.message, true);
  } catch(e) { showToast('Network error', true); }
}

async function deleteStop(id) {
  try { await fetch(API + '/api/bus/stop/' + id, { method:'DELETE' }); stops = stops.filter(s => s.id !== id); renderStops(); } catch(e) {}
}

// ── SCREEN 4: ANNOUNCE ──

async function startTrip() {
  if (!stops.length) { showToast('Add stops first', true); return; }
  const c = companies.find(x => x.id == selectedCompanyId);
  const r = routes.find(x => x.id == selectedRouteId);
  const companyName = c ? c.company_name : 'Bus';
  const routeName = r ? r.route_name : '';
  const origin = r ? (r.origin || '') : '';
  const dest = r ? (r.destination || '') : '';
  try {
    const resp = await fetch(API + '/api/bus/start-trip', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company_id:selectedCompanyId,company_name:companyName,route_id:selectedRouteId,route_name:routeName,origin:origin,destination:dest,stops:stops.map(s=>({id:s.id,stop_name:s.stop_name,stop_order:s.stop_order,is_break_point:s.is_break_point?true:false}))}) });
    const d = await resp.json();
    if (d.success) {
      announcedIds = new Set();
      document.getElementById('tripCompany').textContent = companyName;
      document.getElementById('tripRoute').textContent = (origin ? origin+' → ' : '') + (dest || routeName);
      renderAnnounceCards();
      showScreen('screen4');
      showToast('Trip started!');
    }
  } catch(e) { showToast('Network error', true); }
}

function renderAnnounceCards() {
  const el = document.getElementById('announceList');
  el.innerHTML = stops.sort((a,b)=>a.stop_order-b.stop_order).map((s,i) => {
    const done = announcedIds.has(s.id);
    const cls = done ? ' done' : (s.is_break_point ? ' is-break' : '');
    return '<div class="announce-card'+cls+'" onclick="'+(done?'':'announceStop('+s.id+',\''+s.stop_name.replace(/'/g,"\\'")+'\','+s.stop_order+','+(s.is_break_point?1:0)+')')+'">'+
      '<div class="announce-num">'+(i+1)+'</div>'+
      '<div class="announce-info">'+
      '<div class="announce-name">'+s.stop_name+'</div>'+
      '<div class="announce-status">'+(done?'✓ Announced':(s.is_break_point?'Break Point — Tap to Announce':'Tap to Announce'))+'</div>'+
      '</div>'+
      '<button class="announce-action">'+(done?'Done':'Announce')+'</button>'+
      '</div>';
  }).join('');
}

async function announceStop(id, name, order, isBreak) {
  try {
    const r = await fetch(API + '/api/bus/announce', { method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({stop_id:id,stop_name:name,stop_order:order,is_break_point:!!isBreak}) });
    const d = await r.json();
    if (d.success) { announcedIds.add(id); renderAnnounceCards(); showToast('Announced: ' + name); }
  } catch(e) { showToast('Network error', true); }
}

async function endTrip() {
  try {
    await fetch(API + '/api/bus/reset', { method:'POST' });
    announcedIds = new Set();
    showScreen('screen1');
    showToast('Trip ended');
  } catch(e) {}
}

// ── SCREEN 5: MANAGE ADS ──

async function loadAds() {
  try {
    const r = await fetch(API + '/api/bus/ads');
    const d = await r.json();
    if (d.success) renderAds(d.ads || []);
  } catch(e) {}
}

function renderAds(ads) {
  const el = document.getElementById('adGrid');
  if (!ads.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:#9ca3af;grid-column:1/-1">No ads uploaded yet. Add your first ad below.</div>'; return; }
  el.innerHTML = ads.map(a =>
    '<div class="ad-card">'+
    '<img src="/ads/'+a.filename+'" alt="ad">'+
    '<button class="ad-card-delete" onclick="deleteAd('+a.id+')">&times;</button>'+
    '<div class="ad-card-name">'+(a.original_name||'Ad')+'</div>'+
    '</div>'
  ).join('');
}

async function uploadAd() {
  const input = document.getElementById('adFileInput');
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch(API + '/api/bus/ads', { method:'POST', body:fd });
    const d = await r.json();
    if (d.success) { showToast('Ad uploaded'); loadAds(); }
    else showToast(d.message, true);
  } catch(e) { showToast('Upload failed', true); }
  input.value = '';
}

async function deleteAd(id) {
  if (!confirm('Delete this ad?')) return;
  try {
    const r = await fetch(API + '/api/bus/ads/' + id, { method:'DELETE' });
    const d = await r.json();
    if (d.success) { showToast('Ad deleted'); loadAds(); }
    else showToast(d.message, true);
  } catch(e) { showToast('Delete failed', true); }
}

async function init() {
  try {
    const r = await fetch(API + '/api/bus/current-state');
    const d = await r.json();
    if (d.success && d.is_active && d.all_stops && d.all_stops.length) {
      stops = d.all_stops;
      announcedIds = new Set(d.announced_stops || []);
      selectedCompanyId = d.company_id;
      selectedRouteId = d.route_id;
      document.getElementById('tripCompany').textContent = d.company_name;
      const routeLabel = (d.origin ? d.origin + ' → ' : '') + (d.destination || d.route_name);
      document.getElementById('tripRoute').textContent = routeLabel;
      renderAnnounceCards();
      showScreen('screen4');
      showToast('Resumed active trip');
      return;
    }
  } catch(e) {}
  loadCompanies();
}
init();
</script>
</body>
</html>
