<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Display — SMQSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#070d09;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.display{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

.brand{position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:12px}
.brand svg{width:32px;height:32px;fill:#ffd700}
.brand-text{font-size:14px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:1px}

.clock{position:absolute;top:24px;right:32px;font-family:'Courier New',monospace;font-size:18px;color:rgba(255,255,255,0.5)}

.main-content{text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}

.no-stop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0.6}
.no-stop-icon{width:80px;height:80px;border:3px solid rgba(255,215,0,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center}
.no-stop-icon svg{width:40px;height:40px;fill:rgba(255,215,0,0.4)}
.no-stop-text{font-size:24px;color:rgba(255,255,255,0.4);font-weight:300}

.stop-display{display:none;flex-direction:column;align-items:center;gap:16px;animation:fadeIn 0.5s ease}
.stop-display.active{display:flex}

.next-label{font-size:clamp(18px,3vw,28px);font-weight:300;color:rgba(255,255,255,0.5);letter-spacing:4px;text-transform:uppercase}

.stop-name{font-size:clamp(48px,10vw,96px);font-weight:700;color:#ffd700;line-height:1.1;text-shadow:0 0 40px rgba(255,215,0,0.3);min-height:1.2em}

.stop-time{font-size:16px;color:rgba(255,255,255,0.3);font-family:'Courier New',monospace}

.progress{display:flex;gap:8px;margin-top:30px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.1);transition:all 0.3s}
.dot.visited{background:#ffd700;box-shadow:0 0 10px rgba(255,215,0,0.5)}
.dot.current{background:#4ade80;box-shadow:0 0 12px rgba(74,222,128,0.6);width:14px;height:14px}
.dot-line{width:20px;height:2px;background:rgba(255,255,255,0.08)}
.dot-line.visited{background:rgba(255,215,0,0.4)}

.voice-indicator{position:absolute;bottom:24px;left:32px;display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,0.3)}
.voice-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;opacity:0.3}
.voice-dot.active{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

.ticker{height:44px;background:rgba(255,215,0,0.05);border-top:1px solid rgba(255,215,0,0.1);display:flex;align-items:center;overflow:hidden;flex-shrink:0}
.ticker-label{padding:0 16px;font-size:11px;font-weight:700;color:#ffd700;letter-spacing:1px;white-space:nowrap}
.ticker-scroll{flex:1;overflow:hidden;white-space:nowrap}
.ticker-text{display:inline-block;animation:tickerScroll 30s linear infinite;font-size:13px;color:rgba(255,255,255,0.4);padding-right:100px}
@keyframes tickerScroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
</style>
</head>
<body>
<div class="display">
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
    <div class="brand-text">SMQSS BUS</div>
  </div>
  <div class="clock" id="clock"></div>

  <div class="main-content">
    <div class="no-stop" id="noStop">
      <div class="no-stop-icon">
        <svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
      </div>
      <div class="no-stop-text">Waiting for conductor...</div>
    </div>

    <div class="stop-display" id="stopDisplay">
      <div class="next-label">Next Stop</div>
      <div class="stop-name" id="stopName"></div>
      <div class="stop-time" id="stopTime"></div>
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <div class="voice-indicator">
    <div class="voice-dot" id="voiceDot"></div>
    <span id="voiceStatus">Voice Ready</span>
  </div>
</div>

<div class="ticker">
  <div class="ticker-label">SMQSS</div>
  <div class="ticker-scroll">
    <span class="ticker-text" id="tickerText">Welcome aboard. The next stop will be announced shortly. SMQSS — Smart Queue Management System.</span>
  </div>
</div>

<audio id="audioPlayer"></audio>

<script>
const API_BASE = window.location.origin;
let lastStopName = null;
let stopHistory = [];
let voiceQueue = [];
let isPlaying = false;

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('clock').textContent = h12 + ':' + m + ' ' + ap;
}
updateClock();
setInterval(updateClock, 10000);

async function fetchCurrentStop() {
  try {
    const res = await fetch(API_BASE + '/api/bus/current-stop');
    const data = await res.json();
    if (data.success && data.stop_name && data.stop_name !== lastStopName) {
      lastStopName = data.stop_name;
      showStop(data.stop_name);
      if (!data.announced) {
        queueVoice('Next stop is ' + data.stop_name);
        fetch(API_BASE + '/api/bus/announce-confirm', { method: 'POST' });
      }
    }
  } catch (e) {}
}

async function fetchHistory() {
  try {
    const res = await fetch(API_BASE + '/api/bus/stop-history');
    const data = await res.json();
    if (data.success) {
      stopHistory = data.stops.map(function(s) { return s.stop_name; });
      renderProgress();
    }
  } catch (e) {}
}

function showStop(name) {
  document.getElementById('noStop').style.display = 'none';
  const display = document.getElementById('stopDisplay');
  display.classList.add('active');
  document.getElementById('stopName').textContent = name;
  const now = new Date();
  document.getElementById('stopTime').textContent = now.toLocaleTimeString('en-UG', { hour: '2-digit', minute: '2-digit', hour12: true });
}

function renderProgress() {
  const container = document.getElementById('progress');
  if (stopHistory.length === 0) { container.innerHTML = ''; return; }
  const recent = stopHistory.slice(0, 10).reverse();
  let html = '';
  recent.forEach(function(s, i) {
    const isCurrent = (i === recent.length - 1);
    html += '<div class="dot-line' + (i < recent.length - 1 ? ' visited' : '') + '"></div>';
    html += '<div class="dot' + (isCurrent ? ' current' : ' visited') + '" title="' + s + '"></div>';
  });
  container.innerHTML = html;
}

function queueVoice(text) {
  voiceQueue.push(text);
  if (!isPlaying) playNext();
}

async function playNext() {
  if (voiceQueue.length === 0) { isPlaying = false; return; }
  isPlaying = true;
  const text = voiceQueue.shift();
  const dot = document.getElementById('voiceDot');
  const status = document.getElementById('voiceStatus');
  dot.classList.add('active');
  status.textContent = 'Announcing...';
  try {
    const res = await fetch(API_BASE + '/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    if (res.ok) {
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = document.getElementById('audioPlayer');
      audio.src = url;
      await new Promise(function(resolve) {
        audio.onended = resolve;
        audio.onerror = resolve;
        audio.play().catch(resolve);
      });
      URL.revokeObjectURL(url);
    }
  } catch (e) {}
  dot.classList.remove('active');
  status.textContent = 'Voice Ready';
  playNext();
}

fetchCurrentStop();
fetchHistory();
setInterval(fetchCurrentStop, 2000);
setInterval(fetchHistory, 5000);
</script>
</body>
</html>
