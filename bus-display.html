<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Display — SMQSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#070d09;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.top-bar{background:linear-gradient(135deg,rgba(21,92,48,0.9),rgba(30,125,67,0.9));padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #d4aa00}
.company-info{display:flex;align-items:center;gap:14px}
.company-icon{width:42px;height:42px;background:rgba(255,215,0,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,215,0,0.3)}
.company-icon svg{width:22px;height:22px;fill:#ffd700}
.company-name{font-size:20px;font-weight:700;color:#fff}
.company-route{font-size:13px;color:rgba(255,255,255,0.7);margin-top:1px}
.top-clock{font-family:'Courier New',monospace;font-size:22px;font-weight:700;color:#fff;letter-spacing:2px;text-shadow:0 0 15px rgba(255,255,255,0.15)}

.display{flex:1;display:flex;position:relative;overflow:hidden}

.stop-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2}

.waiting-state{display:none;flex-direction:column;align-items:center;gap:20px}
.waiting-icon{width:100px;height:100px;border:3px solid rgba(255,215,0,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite}
.waiting-icon svg{width:50px;height:50px;fill:rgba(255,215,0,0.3)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.waiting-text{font-size:22px;color:rgba(255,255,255,0.3);font-weight:300}

.journey-state{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:30px;width:100%;max-width:900px}
.journey-state.active{display:flex;animation:fadeUp .6s ease}
.journey-company{font-size:clamp(28px,5vw,48px);font-weight:800;color:#fff;text-shadow:0 0 30px rgba(255,255,255,0.1)}
.journey-route-label{font-size:20px;color:rgba(255,215,0,0.8);font-weight:600;margin-top:-8px}
.journey-track{position:relative;width:100%;height:100px;display:flex;align-items:center;margin:10px 0}
.journey-line{position:absolute;top:50%;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,rgba(255,215,0,0.3) 0,rgba(255,215,0,0.3) 8px,transparent 8px,transparent 16px);transform:translateY(-50%)}
.journey-line.scrolling{animation:roadScroll 0.6s linear infinite}
@keyframes roadScroll{from{background-position:0 0}to{background-position:-16px 0}}
.journey-dots{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);display:flex;justify-content:space-between;padding:0 20px;z-index:1}
.journey-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.2);transition:all .3s}
.journey-dot.visited{background:#ffd700;border-color:#ffd700;box-shadow:0 0 8px rgba(255,215,0,0.4)}
.journey-dot.current{background:#4ade80;border-color:#4ade80;box-shadow:0 0 12px rgba(74,222,128,0.5);width:18px;height:18px}
.journey-dot.upcoming{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.15)}
.journey-message{font-size:18px;color:rgba(255,255,255,0.4);font-weight:400;margin-top:8px}
.journey-ad{font-size:20px;color:rgba(255,215,0,0.7);font-weight:600;min-height:30px;transition:opacity .5s ease;margin-top:4px}

.journey-bus-icon{position:absolute;bottom:50%;z-index:3;transition:left 1.2s cubic-bezier(0.25,0.1,0.25,1);filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));transform:translateY(6px)}
.journey-bus-icon.driving{animation:busDrive 0.35s ease-in-out infinite}
.journey-bus-icon.arriving{animation:busArrive 0.4s ease-in-out 3}
.journey-bus-icon.stopped{animation:none;transform:translateY(6px)}
.bus-img{width:130px;height:auto;display:block}
@keyframes busDrive{0%,100%{transform:translateY(6px) rotate(0deg)}30%{transform:translateY(4px) rotate(-0.3deg)}60%{transform:translateY(5px) rotate(0.2deg)}}
@keyframes busArrive{0%,100%{transform:translateY(6px)}50%{transform:translateY(0px)}}

.motion-lines{position:absolute;right:100%;bottom:20px;display:flex;flex-direction:column;gap:5px;padding-right:6px;opacity:0;transition:opacity .3s}
.driving .motion-lines{opacity:1}
.arriving .motion-lines{opacity:0.6}
.motion-line{height:2px;border-radius:2px;background:rgba(255,215,0,0.35);animation:motionFade 0.6s ease-in-out infinite}
.motion-line:nth-child(1){width:28px;animation-delay:0s}
.motion-line:nth-child(2){width:20px;animation-delay:0.12s}
.motion-line:nth-child(3){width:14px;animation-delay:0.24s}
@keyframes motionFade{0%,100%{opacity:0.15;transform:translateX(6px)}50%{opacity:0.6;transform:translateX(0)}}

.announce-state{display:none;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px}
.announce-state.active{display:flex;animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.next-label{font-size:18px;font-weight:300;color:rgba(255,255,255,0.4);letter-spacing:6px;text-transform:uppercase}
.stop-name-display{font-size:clamp(52px,12vw,110px);font-weight:800;color:#ffd700;line-height:1.05;text-shadow:0 0 60px rgba(255,215,0,0.4),0 0 120px rgba(255,215,0,0.15);padding:10px 40px;position:relative}
.stop-name-display::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:80%;height:3px;background:linear-gradient(90deg,transparent,#ffd700,transparent)}

.announce-subtitle{max-width:800px;font-size:18px;color:rgba(255,255,255,0.55);line-height:1.5;margin-top:4px;animation:fadeUp .8s ease .2s both}

.exit-arrows{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:14px;animation:bounceDown 1.5s ease-in-out infinite}
.exit-arrows svg{width:48px;height:48px;fill:#4ade80;filter:drop-shadow(0 0 8px rgba(74,222,128,0.5))}
.exit-label{font-size:14px;font-weight:700;color:#4ade80;letter-spacing:3px;text-transform:uppercase}
@keyframes bounceDown{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

.prayer-box{margin-top:18px;max-width:700px;padding:16px 24px;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.15);border-radius:12px;animation:fadeUp .8s ease .3s both}
.prayer-text{font-size:15px;color:rgba(255,255,255,0.6);line-height:1.6;font-style:italic;text-align:center}
.prayer-label{font-size:10px;font-weight:700;color:rgba(255,215,0,0.4);text-transform:uppercase;letter-spacing:2px;text-align:center;margin-bottom:6px}

.side-panel{width:380px;background:rgba(255,255,255,0.03);border-left:2px solid rgba(255,215,0,0.15);padding:0 0 20px 0;display:flex;flex-direction:column;overflow-y:auto}

.side-header{background:linear-gradient(135deg,rgba(212,170,0,0.12),rgba(212,170,0,0.04));padding:20px 20px 14px;border-bottom:2px solid rgba(255,215,0,0.2)}
.side-title{font-size:32px;font-weight:900;color:#ffd700;letter-spacing:1px;line-height:1.1;text-transform:uppercase;text-shadow:0 0 30px rgba(255,215,0,0.2)}
.side-subtitle{font-size:13px;color:rgba(255,215,0,0.5);margin-top:4px;font-weight:500}

.side-stops{padding:16px 20px;display:flex;flex-direction:column;gap:6px;flex:1}

.stop-list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;margin-bottom:4px;transition:all .3s;border:1px solid rgba(74,222,128,0.15)}
.stop-list-item.upcoming{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.2)}
.stop-list-item.visited{background:rgba(74,222,128,0.12);border-color:rgba(74,222,128,0.3)}
.stop-list-item.current{background:rgba(74,222,128,0.18);border:2px solid rgba(74,222,128,0.5);box-shadow:0 0 20px rgba(74,222,128,0.12)}

.stop-num{font-size:16px;font-weight:800;color:rgba(74,222,128,0.6);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.2);transition:all .3s}
.stop-list-item.current .stop-num{background:#4ade80;color:#070d09;font-size:18px;box-shadow:0 0 12px rgba(74,222,128,0.4);border-color:#4ade80}
.stop-list-item.visited .stop-num{background:rgba(74,222,128,0.2);color:#4ade80;border-color:rgba(74,222,128,0.3)}

.stop-list-label{font-size:20px;font-weight:600;color:rgba(74,222,128,0.7);line-height:1.2}
.stop-list-item.current .stop-list-label{color:#fff;font-weight:700}
.stop-list-item.visited .stop-list-label{color:#4ade80;font-weight:600}

.break-badge{font-size:12px;font-weight:700;background:rgba(212,170,0,0.2);color:#d4aa00;padding:3px 10px;border-radius:6px;margin-left:auto;text-transform:uppercase;letter-spacing:1px}
.current-badge{font-size:12px;font-weight:700;background:rgba(74,222,128,0.2);color:#4ade80;padding:3px 10px;border-radius:6px;margin-left:auto;text-transform:uppercase;letter-spacing:1px}

.ticker-wrap{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;flex-direction:column;gap:0}
.ticker-top-bar{height:3px;background:linear-gradient(90deg,#e8c547,#ffec6e,#c9a227,#e8c547);background-size:200% 100%;animation:barShimmer 3s linear infinite}
@keyframes barShimmer{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.ticker-body{display:flex;align-items:stretch;background:rgba(5,10,6,0.97);border-top:1px solid rgba(201,162,39,0.4);overflow:hidden;height:56px}
.ticker-label{display:flex;align-items:center;gap:8px;padding:0 28px 0 20px;background:#c9a227;flex-shrink:0;position:relative;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);min-width:140px}
.ticker-label-dot{width:8px;height:8px;border-radius:50%;background:#0f2318;animation:pulseDot 1s infinite;flex-shrink:0}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.ticker-label-text{font-size:13px;font-weight:800;color:#0f2318;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.ticker-scroll-track{flex:1;overflow:hidden;display:flex;align-items:center;position:relative}
.ticker-scroll-inner{display:flex;align-items:center;gap:0;white-space:nowrap;animation:tickerScroll 28s linear infinite;will-change:transform}
.ticker-scroll-track:hover .ticker-scroll-inner{animation-play-state:paused}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:0;padding:0 10px 0 0}
.ticker-office-badge{display:inline-flex;align-items:center;background:rgba(105,255,156,0.12);border:1px solid rgba(105,255,156,0.35);color:#69ff9c;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:4px;margin-right:10px;flex-shrink:0}
.ticker-message-text{font-size:16px;color:#ffffff;font-weight:500;letter-spacing:0.1px}
.ticker-sep{display:inline-block;color:#e8c547;font-size:16px;margin:0 28px;opacity:0.7;flex-shrink:0}
.ticker-scroll-track::after{content:'';position:absolute;top:0;right:0;width:80px;height:100%;background:linear-gradient(90deg,transparent,rgba(5,10,6,0.97));pointer-events:none;z-index:2}
.ticker-scroll-track::before{content:'';position:absolute;top:0;left:0;width:30px;height:100%;background:linear-gradient(90deg,rgba(5,10,6,0.97),transparent);pointer-events:none;z-index:2}
.ticker-time{display:flex;align-items:center;padding:0 16px;border-left:1px solid rgba(255,255,255,0.08);flex-shrink:0;font-family:'Courier New',monospace;font-size:14px;color:rgba(255,255,255,0.5);letter-spacing:1px}

.particles{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;background:rgba(255,215,0,0.3);border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

.voice-indicator{position:absolute;bottom:54px;left:20px;display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.2);z-index:3}
.voice-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;opacity:0.3}
.voice-dot.active{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

.ripple{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border:2px solid rgba(255,215,0,0.15);border-radius:50%;animation:rippleOut 2s ease-out infinite;pointer-events:none;z-index:1}
@keyframes rippleOut{0%{width:100px;height:100px;opacity:0.6}100%{width:600px;height:600px;opacity:0}}

@media(max-width:800px){.side-panel{display:none}}
</style>
</head>
<body>
<div class="top-bar">
  <div class="company-info">
    <div class="company-icon"><svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg></div>
    <div>
      <div class="company-name" id="companyName">Bus Company</div>
      <div class="company-route" id="companyRoute">Route</div>
    </div>
  </div>
  <div class="top-clock" id="clock"></div>
</div>

<div class="display">
  <div class="particles" id="particles"></div>
  <div class="ripple" id="ripple" style="display:none"></div>

  <div class="stop-panel">
    <div class="waiting-state" id="waitingState">
      <div class="waiting-icon"><svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg></div>
      <div class="waiting-text">Waiting for conductor to start trip...</div>
    </div>

    <div class="journey-state" id="journeyState">
      <div class="journey-company" id="journeyCompany"></div>
      <div class="journey-route-label" id="journeyRouteLabel"></div>
      <div class="journey-track">
        <div class="journey-line"></div>
        <div class="journey-bus-icon" id="journeyBus">
          <div class="motion-lines">
            <div class="motion-line"></div>
            <div class="motion-line"></div>
            <div class="motion-line"></div>
          </div>
          <img src="/bus.svg" alt="bus" class="bus-img">
        </div>
        <div class="journey-dots" id="journeyDots"></div>
      </div>
      <div class="journey-message" id="journeyMessage">Enjoy your journey</div>
      <div class="journey-ad" id="journeyAd"></div>
    </div>

    <div class="announce-state" id="announceState">
      <div class="next-label">Next Stop</div>
      <div class="stop-name-display" id="stopNameDisplay"></div>
      <div class="announce-subtitle" id="announceSubtitle"></div>
      <div class="exit-arrows">
        <svg viewBox="0 0 24 24"><path d="M11 3.5V1h-2v2.5H7.5v2H9V4.38l-4.12 4.12-1.41-1.41L7.59 2.55l.71-.71L11 3.5zm2 0V1h2v2.5h1.5v2H15V4.38l4.12 4.12 1.41-1.41L14.41 2.55l-.71-.71L11 3.5zM11 20.5V24h-2v-2.5H7.5v-2H9v1.12l-4.12-4.12-1.41 1.41L7.59 21.45l.71.71L11 20.5zm2 0V24h2v-2.5h1.5v-2H15v1.12l4.12-4.12 1.41 1.41L14.41 21.45l-.71.71L11 20.5z"/></svg>
        <svg viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        <div class="exit-label">Getting Off</div>
      </div>
      <div class="prayer-box" id="prayerBox" style="display:none">
        <div class="prayer-label">Journey Mercy Prayer</div>
        <div class="prayer-text" id="prayerText"></div>
      </div>
    </div>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="side-header">
      <div class="side-title">Our Stop Points</div>
      <div class="side-subtitle" id="sideSubtitle">All stops on this route</div>
    </div>
    <div class="side-stops" id="routeStopsList"></div>
  </div>
</div>

<div class="ticker-wrap">
  <div class="ticker-top-bar"></div>
  <div class="ticker-body">
    <div class="ticker-label">
      <div class="ticker-label-dot"></div>
      <span class="ticker-label-text" id="tickerLabel">BUS</span>
    </div>
    <div class="ticker-scroll-track">
      <div class="ticker-scroll-inner" id="tickerInner">
        <div class="ticker-item">
          <span class="ticker-office-badge">INFO</span>
          <span class="ticker-message-text">Welcome aboard. Safe travels. The next stop will be announced shortly.</span>
        </div>
        <span class="ticker-sep">&#9656;</span>
      </div>
    </div>
    <div class="ticker-time" id="tickerTime">--:--</div>
  </div>
</div>

<div class="voice-indicator">
  <div class="voice-dot" id="voiceDot"></div>
  <span id="voiceStatus">Voice Ready</span>
</div>

<audio id="audioPlayer"></audio>

<script>
const API = window.location.origin;
let lastStopId = null;
let voiceQueue = [], isPlaying = false;
let currentDestination = '';
let currentTotalStops = 0;
let tripStartTime = 0;
let lastAnnounceTime = 0;
let adIndex = 0;
let adTimer = null;
let currentCompanyName = '';
const adMessages = [
  'Thank you for choosing __COMPANY__',
  'Safety first: Hold on to handrails',
  'Next stop coming soon...',
  '__COMPANY__ — Your trusted partner',
  'Enjoy your journey with __COMPANY__',
  'Please keep your belongings safe',
  '__COMPANY__ — Travel with confidence',
  'We appreciate your patronage'
];

function getOrdinal(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function buildAnnouncement(stopName, stopOrder, totalStops, destination, isBreak) {
  const ordinal = getOrdinal(stopOrder);
  if (isBreak) {
    return 'We have reached ' + stopName + ', our rest break point. Our dear Passengers we have 5 mins break, you may get out for a short break. We shall continue shortly.';
  }
  let msg = 'We have reached our ' + ordinal + ' stopping point, ' + stopName + '. Passengers of ' + stopName + ', may you please take a leave and thank you for choosing us.';
  if (destination) {
    msg += ' We continue to ' + destination + '.';
  }
  return msg;
}

function updateClock() {
  const d = new Date();
  const h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  const timeStr = (h%12||12)+':'+m+' '+(h>=12?'PM':'AM');
  document.getElementById('clock').textContent = timeStr;
  document.getElementById('tickerTime').textContent = timeStr;
}
updateClock(); setInterval(updateClock, 10000);

(function initParticles(){
  const c = document.getElementById('particles');
  for(let i=0;i<15;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*12)+'s';
    p.style.animationDelay=Math.random()*10+'s';
    c.appendChild(p);
  }
})();

function ensureBusDriving() {
  const bus = document.getElementById('journeyBus');
  if (bus && !bus.classList.contains('driving') && !bus.classList.contains('arriving')) {
    bus.classList.remove('stopped');
    bus.classList.add('driving');
    const roadLine = document.querySelector('.journey-line');
    if (roadLine) roadLine.classList.add('scrolling');
  }
}

async function pollState() {
  try {
    const r = await fetch(API+'/api/bus/current-state');
    const d = await r.json();
    if (!d.success) return;

    if (d.company_name) {
      currentCompanyName = d.company_name;
      document.getElementById('companyName').textContent = d.company_name;
      document.getElementById('tickerLabel').textContent = d.company_name;
      const route = (d.origin && d.destination) ? d.origin+' → '+d.destination : d.route_name;
      document.getElementById('companyRoute').textContent = route;
      updateTickerContent(d.company_name, route);
      currentDestination = d.destination || '';
    }

    if (d.all_stops && d.all_stops.length) {
      currentTotalStops = d.all_stops.length;
      document.getElementById('sideSubtitle').textContent = d.all_stops.length + ' stops on this route';
      renderRouteStops(d.all_stops, d.announced_stops || [], d.stop_id);
    }

    if (d.stop_name && d.stop_id !== lastStopId) {
      lastStopId = d.stop_id;
      lastAnnounceTime = Date.now();
      showAnnouncement(d.stop_name, d.prayer);

      if (!d.announced) {
        const announcement = buildAnnouncement(d.stop_name, d.stop_order || 1, currentTotalStops, currentDestination, d.is_break_point);
        document.getElementById('announceSubtitle').textContent = announcement;
        queueVoice(announcement);
        if (d.prayer) queueVoice(d.prayer);
        fetch(API+'/api/bus/announce-confirm',{method:'POST'});
      }
    }

    if (d.all_stops && d.all_stops.length && !d.stop_name) {
      if (!tripStartTime) {
        tripStartTime = Date.now();
        lastAnnounceTime = Date.now();
        showJourneyState(d.all_stops, d.announced_stops || []);
      }
      ensureBusDriving();
    }

    if (!d.stop_name && !d.all_stops.length) {
      tripStartTime = 0;
      lastAnnounceTime = 0;
      adIndex = 0;
      document.getElementById('waitingState').style.display = 'flex';
      document.getElementById('journeyState').classList.remove('active');
      document.getElementById('announceState').classList.remove('active');
      document.getElementById('ripple').style.display = 'none';
      if (adTimer) { clearInterval(adTimer); adTimer = null; }
    }

    checkDelay();
  } catch(e) {}
}

function showJourneyState(stops, announcedIds) {
  const js = document.getElementById('journeyState');
  if (!js.classList.contains('active')) {
    js.classList.add('active');
  }
  document.getElementById('waitingState').style.display = 'none';
  document.getElementById('announceState').classList.remove('active');
  document.getElementById('ripple').style.display = 'none';

  document.getElementById('journeyCompany').textContent = currentCompanyName;
  const route = document.getElementById('companyRoute').textContent;
  document.getElementById('journeyRouteLabel').textContent = route;

  const dotsEl = document.getElementById('journeyDots');
  dotsEl.innerHTML = stops.map((s,i) => {
    let cls = 'upcoming';
    if (announcedIds.includes(s.id)) cls = 'visited';
    return '<div class="journey-dot '+cls+'"></div>';
  }).join('');

  const announcedCount = announcedIds.length;
  const total = stops.length;
  const busPos = total > 1 ? (announcedCount / (total - 1)) * 80 + 10 : 50;
  const bus = document.getElementById('journeyBus');
  bus.classList.remove('stopped', 'arriving');
  bus.classList.add('driving');
  bus.style.left = busPos + '%';
  const roadLine = document.querySelector('.journey-line');
  if (roadLine) roadLine.classList.add('scrolling');
  setTimeout(() => { bus.classList.remove('driving'); bus.classList.add('stopped'); if (roadLine) roadLine.classList.remove('scrolling'); }, 1800);

  document.getElementById('journeyAd').textContent = '';
  document.getElementById('journeyAd').style.opacity = '0';
  startAdRotation();
}

function startAdRotation() {
  if (adTimer) clearInterval(adTimer);
  adTimer = setInterval(() => {
    if (Date.now() - lastAnnounceTime > 180000) {
      const adEl = document.getElementById('journeyAd');
      adEl.style.opacity = '0';
      setTimeout(() => {
        const msg = adMessages[adIndex % adMessages.length].replace(/__COMPANY__/g, currentCompanyName);
        adEl.textContent = msg;
        adEl.style.opacity = '1';
        adIndex++;
      }, 500);
    }
  }, 5000);
}

function checkDelay() {
  if (!tripStartTime || !lastAnnounceTime) return;
  const elapsed = Date.now() - lastAnnounceTime;
  const msgEl = document.getElementById('journeyMessage');
  if (elapsed > 180000) {
    msgEl.textContent = 'Next stop coming soon...';
    msgEl.style.color = 'rgba(255,215,0,0.6)';
  } else {
    msgEl.textContent = 'Enjoy your journey';
    msgEl.style.color = 'rgba(255,255,255,0.4)';
  }
}

function showAnnouncement(name, prayer) {
  const as = document.getElementById('announceState');
  if (!as.classList.contains('active')) {
    as.classList.add('active');
  }
  document.getElementById('waitingState').style.display = 'none';
  document.getElementById('journeyState').classList.remove('active');
  document.getElementById('stopNameDisplay').textContent = name;
  document.getElementById('ripple').style.display = 'block';

  if (prayer) {
    document.getElementById('prayerBox').style.display = 'block';
    document.getElementById('prayerText').textContent = prayer;
  } else {
    document.getElementById('prayerBox').style.display = 'none';
  }
}

function renderRouteStops(stops, announcedIds, currentId) {
  const el = document.getElementById('routeStopsList');
  el.innerHTML = stops.map((s,i) => {
    let cls = 'upcoming';
    if (s.id === currentId) cls = 'current';
    else if (announcedIds.includes(s.id)) cls = 'visited';
    return '<div class="stop-list-item '+cls+'">'+
      '<div class="stop-num">'+(i+1)+'</div>'+
      '<div class="stop-list-label">'+s.stop_name+'</div>'+
      (s.is_break_point?'<span class="break-badge">REST</span>':'')+
      (cls==='current'?'<span class="current-badge">NOW</span>':'')+
      '</div>';
  }).join('');
}

function queueVoice(text) {
  voiceQueue.push(text);
  if (!isPlaying) playNext();
}

async function playNext() {
  if (!voiceQueue.length) { isPlaying=false; return; }
  isPlaying = true;
  const text = voiceQueue.shift();
  document.getElementById('voiceDot').classList.add('active');
  document.getElementById('voiceStatus').textContent = 'Announcing...';
  try {
    const r = await fetch(API+'/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if (r.ok) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const audio = document.getElementById('audioPlayer');
      audio.src = url;
      await new Promise(res => { audio.onended=res; audio.onerror=res; audio.play().catch(res); });
      URL.revokeObjectURL(url);
    }
  } catch(e) {}
  document.getElementById('voiceDot').classList.remove('active');
  document.getElementById('voiceStatus').textContent = 'Voice Ready';
  playNext();
}

function updateTickerContent(company, route) {
  const inner = document.getElementById('tickerInner');
  const msgs = [
    {badge:'INFO', text:'Welcome aboard '+company+'. Safe travels.'},
    {badge:'ROUTE', text:route+'. Listen for stop announcements.'},
    {badge:'SAFETY', text:'Please hold on to handrails while the bus is in motion.'},
    {badge:'INFO', text:route+' — Next stop will be announced shortly.'},
    {badge:company.toUpperCase(), text:'Thank you for choosing '+company+'. Have a pleasant journey.'},
    {badge:'SAFETY', text:'Keep your belongings safe at all times.'},
    {badge:company.toUpperCase(), text:route+' — Enjoy your journey with us.'}
  ];
  inner.innerHTML = msgs.map(m =>
    '<div class="ticker-item"><span class="ticker-office-badge">'+m.badge+'</span><span class="ticker-message-text">'+m.text+'</span></div><span class="ticker-sep">&#9656;</span>'
  ).join('');
}

document.getElementById('waitingState').style.display = 'flex';
pollState();
setInterval(pollState, 2000);
</script>
</body>
</html>
