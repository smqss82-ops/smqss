<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Display — SMQSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#070d09;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.top-bar{background:linear-gradient(135deg,rgba(21,92,48,0.9),rgba(30,125,67,0.9));padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #d4aa00}
.company-info{display:flex;align-items:center;gap:14px}
.company-icon{width:42px;height:42px;background:rgba(255,215,0,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,215,0,0.3)}
.company-icon svg{width:22px;height:22px;fill:#ffd700}
.company-name{font-size:20px;font-weight:700;color:#fff}
.company-route{font-size:13px;color:rgba(255,255,255,0.7);margin-top:1px}
.top-clock{font-family:'Courier New',monospace;font-size:16px;color:rgba(255,255,255,0.6)}

.display{flex:1;display:flex;position:relative;overflow:hidden}

.stop-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2}

.waiting-state{display:flex;flex-direction:column;align-items:center;gap:20px}
.waiting-icon{width:100px;height:100px;border:3px solid rgba(255,215,0,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite}
.waiting-icon svg{width:50px;height:50px;fill:rgba(255,215,0,0.3)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.waiting-text{font-size:22px;color:rgba(255,255,255,0.3);font-weight:300}

.announce-state{display:none;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px}
.announce-state.active{display:flex;animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.next-label{font-size:18px;font-weight:300;color:rgba(255,255,255,0.4);letter-spacing:6px;text-transform:uppercase}
.stop-name-display{font-size:clamp(52px,12vw,110px);font-weight:800;color:#ffd700;line-height:1.05;text-shadow:0 0 60px rgba(255,215,0,0.4),0 0 120px rgba(255,215,0,0.15);padding:10px 40px;position:relative}
.stop-name-display::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:80%;height:3px;background:linear-gradient(90deg,transparent,#ffd700,transparent)}

.exit-arrows{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:16px;animation:bounceDown 1.5s ease-in-out infinite}
.exit-arrows svg{width:48px;height:48px;fill:#4ade80;filter:drop-shadow(0 0 8px rgba(74,222,128,0.5))}
.exit-label{font-size:14px;font-weight:700;color:#4ade80;letter-spacing:3px;text-transform:uppercase}
@keyframes bounceDown{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

.prayer-box{margin-top:20px;max-width:700px;padding:16px 24px;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.15);border-radius:12px;animation:fadeUp .8s ease .3s both}
.prayer-text{font-size:15px;color:rgba(255,255,255,0.6);line-height:1.6;font-style:italic;text-align:center}
.prayer-label{font-size:10px;font-weight:700;color:rgba(255,215,0,0.4);text-transform:uppercase;letter-spacing:2px;text-align:center;margin-bottom:6px}

.side-panel{width:280px;background:rgba(255,255,255,0.02);border-left:1px solid rgba(255,255,255,0.06);padding:20px 16px;display:flex;flex-direction:column;overflow-y:auto}
.side-title{font-size:11px;font-weight:700;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.stop-list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;transition:all .3s}
.stop-list-item.current{background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.2)}
.stop-list-item.visited{opacity:0.5}
.stop-list-item.upcoming{opacity:0.3}
.dot-indicator{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.1);flex-shrink:0;transition:all .3s}
.stop-list-item.current .dot-indicator{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,0.6)}
.stop-list-item.visited .dot-indicator{background:#ffd700}
.stop-list-label{font-size:13px;color:rgba(255,255,255,0.6)}
.stop-list-item.current .stop-list-label{color:#fff;font-weight:600}
.stop-list-item.visited .stop-list-label{color:rgba(255,215,0,0.7)}
.break-badge{font-size:9px;background:rgba(212,170,0,0.2);color:#d4aa00;padding:1px 6px;border-radius:4px;margin-left:auto}

.ticker{height:44px;background:rgba(21,92,48,0.15);border-top:1px solid rgba(255,215,0,0.1);display:flex;align-items:center;overflow:hidden;flex-shrink:0}
.ticker-label{padding:0 16px;font-size:11px;font-weight:700;color:#d4aa00;letter-spacing:1px;white-space:nowrap;border-right:1px solid rgba(255,215,0,0.1)}
.ticker-scroll{flex:1;overflow:hidden;white-space:nowrap}
.ticker-text{display:inline-block;animation:tickerScroll 35s linear infinite;font-size:13px;color:rgba(255,255,255,0.4);padding-right:100px}
@keyframes tickerScroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

.particles{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;background:rgba(255,215,0,0.3);border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

.voice-indicator{position:absolute;bottom:54px;left:20px;display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.2);z-index:3}
.voice-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;opacity:0.3}
.voice-dot.active{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

.ripple{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border:2px solid rgba(255,215,0,0.15);border-radius:50%;animation:rippleOut 2s ease-out infinite;pointer-events:none;z-index:1}
@keyframes rippleOut{0%{width:100px;height:100px;opacity:0.6}100%{width:600px;height:600px;opacity:0}}

@media(max-width:800px){.side-panel{display:none}}
</style>
</head>
<body>
<div class="top-bar">
  <div class="company-info">
    <div class="company-icon"><svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg></div>
    <div>
      <div class="company-name" id="companyName">Bus Company</div>
      <div class="company-route" id="companyRoute">Route</div>
    </div>
  </div>
  <div class="top-clock" id="clock"></div>
</div>

<div class="display">
  <div class="particles" id="particles"></div>
  <div class="ripple" id="ripple" style="display:none"></div>

  <div class="stop-panel">
    <div class="waiting-state" id="waitingState">
      <div class="waiting-icon"><svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg></div>
      <div class="waiting-text">Waiting for conductor to start trip...</div>
    </div>

    <div class="announce-state" id="announceState">
      <div class="next-label">Next Stop</div>
      <div class="stop-name-display" id="stopNameDisplay"></div>
      <div class="exit-arrows">
        <svg viewBox="0 0 24 24"><path d="M11 3.5V1h-2v2.5H7.5v2H9V4.38l-4.12 4.12-1.41-1.41L7.59 2.55l.71-.71L11 3.5zm2 0V1h2v2.5h1.5v2H15V4.38l4.12 4.12 1.41-1.41L14.41 2.55l-.71-.71L11 3.5zM11 20.5V24h-2v-2.5H7.5v-2H9v1.12l-4.12-4.12-1.41 1.41L7.59 21.45l.71.71L11 20.5zm2 0V24h2v-2.5h1.5v-2H15v1.12l4.12-4.12 1.41 1.41L14.41 21.45l-.71.71L11 20.5z"/></svg>
        <svg viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        <div class="exit-label">Getting Off</div>
      </div>
      <div class="prayer-box" id="prayerBox" style="display:none">
        <div class="prayer-label">Journey Mercy Prayer</div>
        <div class="prayer-text" id="prayerText"></div>
      </div>
    </div>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="side-title">Route Stops</div>
    <div id="routeStopsList"></div>
  </div>
</div>

<div class="ticker">
  <div class="ticker-label" id="tickerCompany">SMQSS BUS</div>
  <div class="ticker-scroll">
    <span class="ticker-text" id="tickerText">Welcome aboard. Safe travels. The next stop will be announced shortly.</span>
  </div>
</div>

<div class="voice-indicator">
  <div class="voice-dot" id="voiceDot"></div>
  <span id="voiceStatus">Voice Ready</span>
</div>

<audio id="audioPlayer"></audio>

<script>
const API = window.location.origin;
let lastStopId = null;
let voiceQueue = [], isPlaying = false;

function updateClock() {
  const d = new Date();
  const h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = (h%12||12)+':'+m+' '+(h>=12?'PM':'AM');
}
updateClock(); setInterval(updateClock, 10000);

// Particles
(function initParticles(){
  const c = document.getElementById('particles');
  for(let i=0;i<15;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*12)+'s';
    p.style.animationDelay=Math.random()*10+'s';
    c.appendChild(p);
  }
})();

async function pollState() {
  try {
    const r = await fetch(API+'/api/bus/current-state');
    const d = await r.json();
    if (!d.success) return;

    // Update company/route
    if (d.company_name) {
      document.getElementById('companyName').textContent = d.company_name;
      document.getElementById('tickerCompany').textContent = d.company_name;
      const route = (d.origin && d.destination) ? d.origin+' → '+d.destination : d.route_name;
      document.getElementById('companyRoute').textContent = route;
      document.getElementById('tickerText').textContent = d.company_name+' | '+route+' | Safe travels. Listen for stop announcements.';
    }

    // Update stop list
    if (d.all_stops && d.all_stops.length) {
      renderRouteStops(d.all_stops, d.announced_stops || [], d.stop_id);
    }

    // New stop announced
    if (d.stop_name && d.stop_id !== lastStopId) {
      lastStopId = d.stop_id;
      showAnnouncement(d.stop_name, d.prayer);

      if (!d.announced) {
        queueVoice('Next stop is '+d.stop_name);
        if (d.prayer) queueVoice(d.prayer);
        fetch(API+'/api/bus/announce-confirm',{method:'POST'});
      }
    }

    // No trip active
    if (!d.stop_name && !d.all_stops.length) {
      document.getElementById('waitingState').style.display = 'flex';
      document.getElementById('announceState').classList.remove('active');
      document.getElementById('ripple').style.display = 'none';
    }
  } catch(e) {}
}

function showAnnouncement(name, prayer) {
  document.getElementById('waitingState').style.display = 'none';
  const as = document.getElementById('announceState');
  as.classList.remove('active');
  void as.offsetWidth;
  as.classList.add('active');
  document.getElementById('stopNameDisplay').textContent = name;
  document.getElementById('ripple').style.display = 'block';

  if (prayer) {
    document.getElementById('prayerBox').style.display = 'block';
    document.getElementById('prayerText').textContent = prayer;
  } else {
    document.getElementById('prayerBox').style.display = 'none';
  }
}

function renderRouteStops(stops, announcedIds, currentId) {
  const el = document.getElementById('routeStopsList');
  el.innerHTML = stops.map((s,i) => {
    let cls = 'upcoming';
    if (s.id === currentId) cls = 'current';
    else if (announcedIds.includes(s.id)) cls = 'visited';
    return '<div class="stop-list-item '+cls+'">'+
      '<div class="dot-indicator"></div>'+
      '<div class="stop-list-label">'+s.stop_name+'</div>'+
      (s.is_break_point?'<span class="break-badge">REST</span>':'')+
      '</div>';
  }).join('');
}

function queueVoice(text) {
  voiceQueue.push(text);
  if (!isPlaying) playNext();
}

async function playNext() {
  if (!voiceQueue.length) { isPlaying=false; return; }
  isPlaying = true;
  const text = voiceQueue.shift();
  document.getElementById('voiceDot').classList.add('active');
  document.getElementById('voiceStatus').textContent = 'Announcing...';
  try {
    const r = await fetch(API+'/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if (r.ok) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const audio = document.getElementById('audioPlayer');
      audio.src = url;
      await new Promise(res => { audio.onended=res; audio.onerror=res; audio.play().catch(res); });
      URL.revokeObjectURL(url);
    }
  } catch(e) {}
  document.getElementById('voiceDot').classList.remove('active');
  document.getElementById('voiceStatus').textContent = 'Voice Ready';
  playNext();
}

pollState();
setInterval(pollState, 2000);
</script>
</body>
</html>
